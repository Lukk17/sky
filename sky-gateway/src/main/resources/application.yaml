sky-gateway:
  booking-uri: ${BOOKING_URI:http://localhost:5555}
  offer-uri: ${OFFER_URI:http://localhost:5552}
  message-uri: ${MESSAGE_URI:http://localhost:5553}
  notify-uri: ${NOTIFY_URI:http://localhost:5554}

server:
  port: ${GATEWAY_PORT:5777}

spring:
  application:
    name: sky-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-route
              uri: ${sky-gateway.booking-uri}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/user/bookings/**

            - id: offer-route
              uri: ${sky-gateway.offer-uri}
              predicates:
                - Path=/api/v1/offers/**,/api/v1/search,/api/v1/owner/offers/**

            - id: message-route
              uri: ${sky-gateway.message-uri}
              predicates:
                - Path=/api/v1/messages/**

            - id: notify-route
              uri: ${sky-gateway.notify-uri}
              predicates:
                - Path=/notifyWebsocket/**

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org:
      springframework:
        cloud:
          gateway: ${GATEWAY_DEBUG:INFO}
        web: ${SPRING_DEBUG:INFO}

---
spring:
  config:
    activate:
      on-profile: "!local"
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI}
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            scope: openid,email,profile
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: booking-route
              uri: ${sky-gateway.booking-uri}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/user/bookings/**
              filters:
                - TokenRelay=

            - id: offer-route
              uri: ${sky-gateway.offer-uri}
              predicates:
                - Path=/api/v1/offers/**,/api/v1/search,/api/v1/owner/offers/**
              filters:
                - TokenRelay=

            - id: message-route
              uri: ${sky-gateway.message-uri}
              predicates:
                - Path=/api/v1/messages/**
              filters:
                - TokenRelay=

            - id: notify-route
              uri: ${sky-gateway.notify-uri}
              predicates:
                - Path=/notifyWebsocket/**
              filters:
                - TokenRelay=
