openapi: 3.1.0
info:
  title: sky-api
  version: v1
  description: >
    Contract for the sky API. This file is the source of truth for the
    bundle committed at contracts/sky-api/openapi.yaml. The CI re-bundles from
    this file and diffs against the committed bundle.
servers:
  - description: "Local, through the gateway, one origin for the whole stack"
    url: http://localhost:5777
tags:
  - name: Offers
    description: Public browsing and search over the offer inventory.
  - name: Owner offers
    description: Create, edit, delete, and photograph the offers the caller owns.
  - name: Bookings
    description: Booking lifecycle operations.
  - name: Messages
    description: Messaging operations.
security:
  - bearerAuth: []
paths:
  /api/v1/offers:
    get:
      operationId: getAllOffers
      summary: Get all offers (paginated)
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Found offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/offers/{offerId}:
    get:
      operationId: getOfferById
      summary: Get one offer by id
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Offer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/offers/{offerId}/owner:
    get:
      operationId: getOfferOwner
      summary: Get the owner email for an offer
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Owner email returned
          content:
            application/json: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers:
    get:
      operationId: getOwnedOffers
      summary: Get owned offers (paginated)
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Found owned offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: addOffer
      summary: Create new offer
      tags: [Owner offers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferDTO'
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}:
    delete:
      operationId: deleteOffer
      summary: Delete offer
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '204':
          description: Offer deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photo:
    delete:
      operationId: deletePhoto
      summary: Delete the stored photo of an offer
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '204':
          description: Photo removed from storage and cleared on the offer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: uploadPhoto
      summary: Upload photo
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded; updated offer returned with photoUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photos:
    get:
      operationId: getAllPhotos
      summary: Get all photos for an offer
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Photos listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhotoDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: addPhoto
      summary: Add photo to offer
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Photo added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photos/{photoId}:
    delete:
      operationId: deletePhotoById
      summary: Delete photo by id
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204':
          description: Photo removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Photo or offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photos/{photoId}/cover:
    patch:
      operationId: setPhotoAsCover
      summary: Set photo as cover
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '204':
          description: Photo set as cover
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Photo or offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photos/{photoId}/position:
    put:
      operationId: updatePhotoPosition
      summary: Update photo position
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/PhotoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhotoPositionDTO'
      responses:
        '204':
          description: Photo position updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Photo or offer not found
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/search:
    get:
      operationId: searchOffers
      summary: Search offers
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/Pageable'
        - in: query
          name: name
          schema:
            type: string
          required: false
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/bookings:
    post:
      operationId: bookOffer
      summary: Create new booking
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPayload'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No offer with that id exists in sky-offer
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/bookings/{bookingId}:
    delete:
      operationId: removeBooking
      summary: Delete booking
      tags: [Bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Booking deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Booking not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/user/bookings:
    get:
      operationId: getBookedOffers
      summary: Get all user's bookings (paginated)
      tags: [Bookings]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Found user bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages:
    post:
      operationId: sendMessage
      summary: Send message
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDTO'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages/received:
    get:
      operationId: getReceivedMessages
      summary: Get received messages (paginated)
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Messages pulled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages/sent:
    get:
      operationId: getSentMessages
      summary: Get sent messages (paginated)
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Messages pulled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Delete message
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Message deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Message not found
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste a Keycloak access token obtained via the Authorization Code flow.
  parameters:
    OfferId:
      in: path
      name: offerId
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      in: path
      name: photoId
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      in: path
      name: bookingId
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        type: string
        format: uuid
    Pageable:
      in: query
      name: pageable
      required: true
      schema:
        $ref: '#/components/schemas/Pageable'
  responses:
    BadRequest:
      description: 'Bad Request: invalid input or a rejected domain rule'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 'Unauthorized: token missing or invalid'
      headers:
        WWW-Authenticate:
          description: Bearer challenge
          schema:
            type: string
          style: simple
    Forbidden:
      description: 'Forbidden: authenticated but not allowed'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
      headers:
        WWW-Authenticate:
          description: Bearer challenge with insufficient_scope
          schema:
            type: string
          style: simple
    Conflict:
      description: 'Conflict: request lost a race'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnsupportedMediaType:
      description: 'Unsupported Media Type'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: 'Internal Server Error'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: 'Bad Gateway: dependency answered in an unusable way'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: 'Service Unavailable: dependency unavailable, retry after Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    Page:
      type: object
      properties:
        content:
          type: array
          items: {}
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    OfferDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ownerEmail:
          type: string
          format: email
        photoUrl:
          type: string
        price:
          type: string
      required:
        - name
        - price
    PhotoDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        cover:
          type: boolean
        position:
          type: integer
          format: int32
        url:
          type: string
    PhotoPositionDTO:
      type: object
      properties:
        position:
          type: integer
          format: int32
    BookingPayload:
      type: object
      properties:
        dateToBook:
          type: string
          format: date
        offerId:
          type: string
          format: uuid
      required:
        - dateToBook
        - offerId
    BookingDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookedDate:
          type: string
          format: date
        bookingUser:
          type: string
          format: email
        offerId:
          type: string
          format: uuid
        ownerEmail:
          type: string
          format: email
    MessageDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdTime:
          type: string
        read:
          type: boolean
        receiverEmail:
          type: string
          format: email
          minLength: 0
          maxLength: 255
        senderEmail:
          type: string
        text:
          type: string
          minLength: 0
          maxLength: 65000
      required:
        - receiverEmail
        - text
