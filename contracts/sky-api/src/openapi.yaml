openapi: 3.1.0
info:
  title: sky-api
  version: v1
  description: >
    Bundled contract for the sky API. This file is the source of truth for the
    bundle committed at contracts/sky-api/openapi.yaml. The CI re-bundles from
    this file and diffs against the committed bundle, so the committed bundle
    is always what this source produces. The service documents under
    docs/api/openapi/ are generated from the running services and are not
    bundled here.
servers:
  - description: "Local, through the gateway, one origin for the whole stack"
    url: http://localhost:5777
  - description: "Local, straight at the service, bypassing the gateway"
    url: http://localhost:5552
paths:
  /api/v1/offers:
    get:
      operationId: getContractStub
      summary: Contract stub for the offer inventory read
      responses:
        "200":
          description: Found offers
        "400":
          description: Bad Request
        "401":
          description: Unauthorized
        "500":
          description: Internal Server Error
        "503":
          description: Service Unavailable