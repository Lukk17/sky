# Test-profile overrides for sky-notify. The integration test bootstraps the full
# Spring context; we don't want it pulling Auth0's JWKS at boot, so we wire a fixed
# unauthenticated set-up. STOMP CONNECT auth is exercised separately by unit tests
# against WebSocketAuthChannelInterceptor.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  security:
    oauth2:
      resourceserver:
        jwt:
          # Dummy value so @Value("${...issuer-uri}") in SecurityConfig resolves without
          # an OAUTH2_ISSUER_URI env-var. The JwtDecoder produced by SecurityConfig is
          # overridden by the @Primary stub in TestSecurityConfig; this URL is never contacted.
          issuer-uri: http://localhost/test-issuer
