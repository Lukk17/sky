<div class="container-fluid">
  <div class="row">
    <div class="col-xs-12 col-md-5">
      @if (error) {
        <div class="alert-danger">
          <p>{{error}}</p>
        </div>
      }
      <p>Sign in continues at the Keycloak login page.</p>
      <div>
        <button (click)="login()" class="btn btn-primary" type="button">Login</button>
      </div>
    </div>
  </div>
</div>
