<div class="flex justify-center mt-10 px-4">
  <p-card styleClass="w-full max-w-xl glass-card edit-offer-card">
    <ng-template #header>
      <h2 class="edit-offer-title" data-testid="edit-offer-title">Edit Offer</h2>
      <p class="edit-offer-subtitle">Keep your listing fresh</p>
    </ng-template>
    @if (error) {
      <p class="text-red-400">{{error}}</p>
    }
    @if (offer) {
    <form #offerForm="ngForm" (ngSubmit)="onSubmit(offerForm)" aria-label="Edit offer form" class="flex flex-col gap-4">
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.hotelName" id="hotelName" name="hotelName" ngModel required type="text" class="w-full" />
        <label for="hotelName">Hotel Name</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.description" id="description" name="description" ngModel required type="text" class="w-full" />
        <label for="description">Description</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.city" id="city" name="city" ngModel required type="text" class="w-full" />
        <label for="city">City</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.country" id="country" name="country" ngModel required type="text" class="w-full" />
        <label for="country">Country</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.coverPhotoUrl" id="photoUrl" name="photoUrl" ngModel type="text" class="w-full" />
        <label for="photoUrl">Photo Link</label>
      </p-floatlabel>
      @if (offer.coverPhotoUrl) {
        <img [src]="offer.coverPhotoUrl" alt="Preview photo of offer" class="w-full aspect-video object-cover rounded-xl" />
      }
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.roomCapacity" id="roomCapacity" name="roomCapacity" ngModel required type="number" class="w-full" />
        <label for="roomCapacity">Room capacity</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText [(ngModel)]="offer.price" id="price" name="price" ngModel required type="number" class="w-full" />
        <label for="price">Price</label>
      </p-floatlabel>
      <p-button label="Save Offer" icon="pi pi-check" type="submit" styleClass="glass-btn-accent" [disabled]="offerForm.invalid" data-testid="edit-submit"></p-button>
    </form>
    } @else if (!error) {
      <p class="muted">Loading offer</p>
    }
  </p-card>
</div>
