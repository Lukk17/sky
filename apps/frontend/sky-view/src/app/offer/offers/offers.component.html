<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
  @for (offer of offers; track offer.id) {
    <p-card styleClass="offer-card" data-testid="offer-card" (click)="goToDetails(offer)" (keyup.enter)="goToDetails(offer)" tabindex="0">
      <ng-template #header>
        <div class="relative">
          @if (offer.coverPhotoUrl) {
            <img alt="Offer cover photo" class="w-full aspect-video object-cover rounded-t-xl" src="{{offer.coverPhotoUrl}}" />
          } @else {
            <p class="aspect-video flex items-center justify-center text-surface-400">No photos yet</p>
          }
        </div>
      </ng-template>
      <h3 class="text-xl font-semibold">{{offer.hotelName}}</h3>
      <div class="flex items-center gap-4 mt-2 text-sm">
        <span class="flex items-center gap-1"><i class="pi pi-map-marker"></i>{{offer.city}}, {{offer.country}}</span>
        <span class="flex items-center gap-1"><i class="pi pi-users"></i>{{offer.roomCapacity}}</span>
      </div>
      <div class="flex items-center justify-between mt-3">
        <span class="offer-price" data-testid="offer-price">${{offer.price}}</span>
        <p-button label="Book" severity="info" size="small" (onClick)="goToDetails(offer); $event.stopPropagation()" data-testid="offer-book"></p-button>
      </div>
    </p-card>
  }
</div>
