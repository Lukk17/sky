<div class="flex justify-center mt-10 px-4">
  <p-card header="New message" styleClass="w-full max-w-xl">
    @if (error) {
      <p class="text-red-400">{{error}}</p>
    }
    <form #messageForm="ngForm" (ngSubmit)="onSubmit(messageForm)" class="flex flex-col gap-4">
      <p-floatlabel variant="on">
        <textarea pTextarea id="text" name="text" ngModel required rows="5" class="w-full"></textarea>
        <label for="text">Message Text</label>
      </p-floatlabel>
      <p-floatlabel variant="on">
        <input pInputText id="receiver" name="receiver" [(ngModel)]="receiver" required type="email" class="w-full" />
        <label for="receiver">Receiver</label>
      </p-floatlabel>
      <p-button label="Send Message" icon="pi pi-send" type="submit" [disabled]="messageForm.invalid"></p-button>
    </form>
  </p-card>
</div>
