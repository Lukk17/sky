extends:
  - recommended

rules:
  # The stub operation is anonymous by design, matching the public offer read
  # in the published document, which carries no root security and marks the
  # list operation with security: []. Relaxed until the contract grows auth.
  security-defined: off
  # The stub is a scaffold, not a production document, so it carries no
  # license field and points at the local development addresses.
  info-license: warn
  no-server-example.com: warn