openapi: 3.1.0
info:
  title: sky-api
  version: v1
  description: >
    Contract for the sky API. This file is the single source of truth for the
    API surface and is linted with the redocly configuration beside it. The
    per-service documents under docs/api/openapi are generated from service
    annotations and are a different artefact.
servers:
  - description: "Local, through the gateway, one origin for the whole stack"
    url: http://localhost:5777
tags:
  - name: Offers
    description: Public browsing and search over the offer inventory.
  - name: Owner offers
    description: Create, edit, delete, and photograph the offers the caller owns.
  - name: Bookings
    description: Booking lifecycle operations.
  - name: Messages
    description: Messaging operations.
security:
  - bearerAuth: []
paths:
  /api/v1/offers:
    get:
      operationId: getAllOffers
      summary: Get all offers (paginated)
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Found offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/offers/{offerId}:
    get:
      operationId: getOfferById
      summary: Get one offer by id
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Offer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/offers/{offerId}/owner:
    get:
      operationId: getOfferOwner
      summary: Get the owner email for an offer
      tags: [Offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: Owner email returned
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers:
    get:
      operationId: getOwnedOffers
      summary: Get owned offers (paginated)
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Found owned offers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: addOffer
      summary: Create new offer
      tags: [Owner offers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferDTO'
      responses:
        '201':
          description: Offer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: edit
      summary: Edit offer
      tags: [Owner offers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferEditDTO'
      responses:
        '200':
          description: Offer edited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/owner/offers/{offerId}:
    delete:
      operationId: deleteOffer
      summary: Delete offer
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '204':
          description: Offer deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photo:
    delete:
      operationId: deletePhoto
      summary: Delete the stored photo of an offer
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '204':
          description: Photo removed from storage and cleared on the offer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: uploadPhoto
      summary: Upload photo
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo uploaded; updated offer returned with photoUrl
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/owner/offers/{offerId}/photos:
    post:
      operationId: uploadGalleryPhoto
      summary: Upload a photo to the offer gallery (owner only)
      description: >
        Appends a photo at the end of the gallery, which holds at most 10
        photos. A concurrent cover change is answered with 409.
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Photo appended to gallery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer not found
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/owner/offers/{offerId}/photos/{photoId}:
    delete:
      operationId: deleteGalleryPhoto
      summary: Delete a gallery photo (owner only)
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Photo removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer or photo not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photos/{photoId}/cover:
    put:
      operationId: setGalleryCover
      summary: Set a gallery photo as cover (owner only)
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Cover updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer or photo not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/owner/offers/{offerId}/photos/{photoId}/position:
    put:
      operationId: reorderGalleryPhoto
      summary: Reorder a gallery photo (owner only)
      tags: [Owner offers]
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/PhotoId'
        - in: query
          name: position
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: Gallery reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Offer or photo not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/search:
    post:
      operationId: search
      summary: Search for offers (paginated)
      description: >
        Searches the offer inventory for the term sent as the request body. The
        term must not be blank, and it must not be longer than 100 characters. A
        term that breaks either rule is answered with 400.
      tags: [Offers]
      security: []
      parameters:
        - $ref: '#/components/parameters/Pageable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
      responses:
        '200':
          description: Offers found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/bookings:
    post:
      operationId: bookOffer
      summary: Create new booking
      tags: [Bookings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingPayload'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No offer with that id exists in sky-offer
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/bookings/{bookingId}:
    delete:
      operationId: removeBooking
      summary: Delete booking
      tags: [Bookings]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '204':
          description: Booking deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Booking not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/user/bookings:
    get:
      operationId: getBookedOffers
      summary: Get all user's bookings (paginated)
      tags: [Bookings]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Found user bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages:
    post:
      operationId: sendMessage
      summary: Send message
      tags: [Messages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageDTO'
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages/received:
    get:
      operationId: getReceivedMessages
      summary: Get received messages (paginated)
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Messages pulled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages/sent:
    get:
      operationId: getSentMessages
      summary: Get sent messages (paginated)
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/Pageable'
      responses:
        '200':
          description: Messages pulled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/messages/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Delete message
      tags: [Messages]
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '204':
          description: Message deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Message not found
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste a Keycloak access token obtained via the Authorization Code flow.
  parameters:
    OfferId:
      in: path
      name: offerId
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      in: path
      name: photoId
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      in: path
      name: bookingId
      required: true
      schema:
        type: string
        format: uuid
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        type: string
        format: uuid
    Pageable:
      in: query
      name: pageable
      required: true
      schema:
        $ref: '#/components/schemas/Pageable'
  responses:
    BadRequest:
      description: 'Bad Request: invalid input or a rejected domain rule'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: 'Unauthorized: token missing or invalid'
      headers:
        WWW-Authenticate:
          description: Bearer challenge
          schema:
            type: string
          style: simple
    Forbidden:
      description: 'Forbidden: authenticated but not allowed'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
      headers:
        WWW-Authenticate:
          description: Bearer challenge with insufficient_scope
          schema:
            type: string
          style: simple
    Conflict:
      description: 'Conflict: request lost a race'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnsupportedMediaType:
      description: 'Unsupported Media Type'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ContentTooLarge:
      description: 'Content Too Large: the upload exceeds the file or gallery limit'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: 'Internal Server Error'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: 'Bad Gateway: dependency answered in an unusable way'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: 'Service Unavailable: dependency unavailable, retry after Retry-After'
      headers:
        Retry-After:
          description: Seconds to wait before retrying; always 10.
          schema:
            type: integer
            format: int32
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: '#/components/schemas/SortObject'
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    Page:
      type: object
      properties:
        content:
          type: array
          items: {}
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: '#/components/schemas/PageableObject'
        size:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    OfferDTO:
      type: object
      properties:
        city:
          type: string
          minLength: 0
          maxLength: 255
        comment:
          type: string
          minLength: 0
          maxLength: 1000
        country:
          type: string
          minLength: 0
          maxLength: 255
        coverPhotoUrl:
          type: string
        description:
          type: string
          minLength: 0
          maxLength: 3000
        externalPhotoUrl:
          type: string
        gallery:
          type: array
          items:
            $ref: '#/components/schemas/PhotoDTO'
        hotelName:
          type: string
          minLength: 0
          maxLength: 255
        id:
          type: string
          format: uuid
        ownerEmail:
          type: string
        photoUrl:
          type: string
        price:
          type: number
          minimum: 0
        roomCapacity:
          type: integer
          format: int64
          minimum: 1
      required:
        - city
        - country
        - hotelName
        - price
        - roomCapacity
    OfferEditDTO:
      type: object
      properties:
        city:
          type: string
          minLength: 0
          maxLength: 255
        comment:
          type: string
          minLength: 0
          maxLength: 1000
        country:
          type: string
          minLength: 0
          maxLength: 255
        description:
          type: string
          minLength: 0
          maxLength: 3000
        externalPhotoUrl:
          type: string
        hotelName:
          type: string
          minLength: 0
          maxLength: 255
        id:
          type: string
          format: uuid
        ownerEmail:
          type: string
        price:
          type: number
          minimum: 0
        roomCapacity:
          type: integer
          format: int64
          minimum: 1
      required:
        - id
    PhotoDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        main:
          type: boolean
        position:
          type: integer
          format: int32
        url:
          type: string
    BookingPayload:
      type: object
      properties:
        dateToBook:
          type: string
          format: date
        offerId:
          type: string
          format: uuid
      required:
        - dateToBook
        - offerId
    BookingDTO:
      type: object
      properties:
        bookedDate:
          type: string
          format: date
          minLength: 1
        bookingUser:
          type: string
          format: email
          minLength: 1
        id:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        ownerEmail:
          type: string
          format: email
      required:
        - bookedDate
        - bookingUser
        - id
        - offerId
        - ownerEmail
    MessageDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdTime:
          type: string
        read:
          type: boolean
        receiverEmail:
          type: string
          format: email
          minLength: 0
          maxLength: 255
        senderEmail:
          type: string
        text:
          type: string
          minLength: 0
          maxLength: 65000
      required:
        - receiverEmail
