openapi: "3.1.0"

info:
  title: sky-message
  version: v1
  description: |
    User-to-user messaging service for the Sky platform. All endpoints require a valid
    Keycloak bearer JWT. The sender identity is derived from the JWT `email` claim;
    callers never set `senderEmail` in the request body.

    The `createdTime` field in responses uses the format `HH:mm:ss dd.MM.yyyy`
    (e.g. `"14:30:00 15.08.2024"`), which is the pattern defined in `DateTimeConstants`.

servers:
  - url: http://localhost:5777/msg/api
    description: Local via Spring Cloud Gateway (sky-gateway on port 5777)
  - url: https://skycloud.luksarna.com/msg/api
    description: Production (GCP via nginx-ingress)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak-issued JWT. Obtain via the password grant or client-credentials grant against
        `https://keycloak.luksarna.com/realms/sky/protocol/openid-connect/token`.
        The `email` claim identifies the sender for all write operations.

  schemas:
    MessageRequest:
      type: object
      description: >
        Request body for sending a message. Only `receiverEmail` and `text` are consumed
        from the request; `senderEmail` and `createdTime` are set server-side.
      required:
        - receiverEmail
      properties:
        receiverEmail:
          type: string
          format: email
          description: Email address of the message recipient. Required and must be a valid email.
          example: "owner@example.com"
        text:
          type: string
          maxLength: 65000
          description: Message body. Optional (the field has no `@NotBlank` constraint).
          example: "Hello, I am interested in your offer. Is the room available for August?"

    MessageDTO:
      type: object
      description: Full message representation returned in responses.
      properties:
        id:
          type: integer
          format: int64
          description: Auto-generated message ID.
          example: 7
        text:
          type: string
          description: Message body.
          example: "Hello, I am interested in your offer. Is the room available for August?"
        receiverEmail:
          type: string
          format: email
          description: Email of the recipient.
          example: "owner@example.com"
        senderEmail:
          type: string
          format: email
          description: Email of the sender, populated from the JWT `email` claim.
          example: "traveller@example.com"
        createdTime:
          type: string
          description: >
            Timestamp formatted as `HH:mm:ss dd.MM.yyyy` (e.g. `"14:30:00 15.08.2024"`).
            Note: this is not ISO-8601; it uses the custom pattern from `DateTimeConstants`.
          example: "14:30:00 15.08.2024"
        read:
          type: boolean
          description: Whether the message has been read by the recipient.
          example: false

    PageOfMessageDTO:
      type: object
      description: Spring Data `Page<MessageDTO>` envelope returned by list endpoints.
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/MessageDTO"
        totalElements:
          type: integer
          format: int64
          example: 12
        totalPages:
          type: integer
          example: 1
        size:
          type: integer
          example: 20
        number:
          type: integer
          description: Zero-based current page index.
          example: 0
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: true
        numberOfElements:
          type: integer
          example: 12
        empty:
          type: boolean
          example: false

    ProblemDetail:
      type: object
      description: >
        RFC 7807 / Spring 6 `ErrorResponse` problem detail. Returned by `GlobalExceptionHandler`
        for validation failures and domain `MessageException` — both mapped to 400.
      properties:
        type:
          type: string
          format: uri
          example: "about:blank"
        title:
          type: string
          example: "Bad Request"
        status:
          type: integer
          example: 400
        detail:
          type: string
          description: >
            Human-readable detail. For validation errors, a semicolon-separated list in the
            form `Field '<name>' <constraint message>`.
          example: "Field 'receiverEmail' must not be blank"
        instance:
          type: string
          format: uri
          example: "/api/v1/messages"

paths:
  /messages:
    post:
      operationId: sendMessage
      summary: Send a message
      description: >
        Sends a message from the authenticated user to `receiverEmail`. The service sets
        `senderEmail` from the JWT `email` claim and `createdTime` from the server clock.
        Returns 201 with the persisted `MessageDTO`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
            example:
              receiverEmail: "owner@example.com"
              text: "Hello, I am interested in your offer. Is the room available for August?"
      responses:
        "201":
          description: Message sent and persisted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDTO"
              example:
                id: 7
                text: "Hello, I am interested in your offer. Is the room available for August?"
                receiverEmail: "owner@example.com"
                senderEmail: "traveller@example.com"
                createdTime: "14:30:00 15.08.2024"
                read: false
        "400":
          description: >
            Validation failure (`receiverEmail` blank or invalid email format, `text` exceeds
            65000 characters) or domain-level `MessageException`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                type: "about:blank"
                title: "Bad Request"
                status: 400
                detail: "Field 'receiverEmail' must not be blank"
                instance: "/api/v1/messages"
        "401":
          description: Missing or invalid bearer token.

  /messages/received:
    get:
      operationId: getReceivedMessages
      summary: Get messages received by the authenticated user (paginated)
      description: >
        Returns a paginated list of messages where the recipient is the user identified by
        the JWT `email` claim. Defaults to page 0, size 20.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Zero-based page index.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of items per page.
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort expression, e.g. `createdTime,desc`. Repeatable.
      responses:
        "200":
          description: Successful — returns a page of received messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfMessageDTO"
              example:
                content:
                  - id: 7
                    text: "Hello, is the room available for August?"
                    receiverEmail: "owner@example.com"
                    senderEmail: "traveller@example.com"
                    createdTime: "14:30:00 15.08.2024"
                    read: false
                totalElements: 1
                totalPages: 1
                size: 20
                number: 0
                first: true
                last: true
                numberOfElements: 1
                empty: false
        "401":
          description: Missing or invalid bearer token.

  /messages/sent:
    get:
      operationId: getSentMessages
      summary: Get messages sent by the authenticated user (paginated)
      description: >
        Returns a paginated list of messages where the sender is the user identified by the
        JWT `email` claim. Defaults to page 0, size 20.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
          description: Zero-based page index.
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
          description: Number of items per page.
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort expression, e.g. `createdTime,desc`. Repeatable.
      responses:
        "200":
          description: Successful — returns a page of sent messages.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfMessageDTO"
              example:
                content:
                  - id: 7
                    text: "Hello, is the room available for August?"
                    receiverEmail: "owner@example.com"
                    senderEmail: "traveller@example.com"
                    createdTime: "14:30:00 15.08.2024"
                    read: false
                totalElements: 1
                totalPages: 1
                size: 20
                number: 0
                first: true
                last: true
                numberOfElements: 1
                empty: false
        "401":
          description: Missing or invalid bearer token.

  /messages/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Delete a message
      description: >
        Removes the message identified by `messageId`. The service verifies that the message
        belongs to the authenticated user before deletion. The `messageId` path parameter
        is parsed as `Long` internally. Returns 200 with a plain-text confirmation string.
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
          description: ID of the message to delete (numeric, passed as string).
          example: "7"
      responses:
        "200":
          description: Message deleted. Body is a plain string.
          content:
            application/json:
              schema:
                type: string
              example: "Message removed."
        "400":
          description: Domain-level `MessageException` (e.g. message not found or not owned by caller).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid bearer token.
