openapi: "3.1.0"

info:
  title: sky-message
  version: v1
  description: |
    User-to-user messaging for the Sky platform. Every operation requires a valid Keycloak bearer
    token carrying the `user` or `admin` realm role. There are no public endpoints.

    The sender is never sent by the caller. `senderEmail` is set server-side from the `email` claim
    of the validated JWT (`SecurityUtils.currentUserEmail()`), and `createdTime` from the server
    clock. There is no `x-auth-request-email` header.

    Every identifier in this API is a UUID. Message ids are `uuid` strings on the wire and `UUID`
    columns in PostgreSQL. Nothing in this contract is a numeric id.

    `createdTime` is not ISO-8601. It is rendered with the pattern `HH:mm:ss dd.MM.yyyy` in the
    `Europe/Warsaw` zone, defined once in `DateTimeConstants`, so `14:30:00 15.08.2024` means
    15 August 2024 at half past two in the afternoon, Warsaw time. Parse it with that pattern, not
    with a date library's default.

    Versioning: the major version lives in the path. Services publish `/api/v1/**` and the gateway
    rewrites `/msg/api/**` onto it. Only version `1` is currently supported; the default version is
    also `1`. A breaking change gets a new path segment rather than a change to this one.

    See [docs/api/README.md](../README.md) for how to mint a token and run the Bruno collection.

servers:
  - url: http://localhost:5777/msg/api
    description: Local, through sky-gateway on port 5777 (rewrites to /api/v1)
  - url: https://skycloud.luksarna.com/msg/api
    description: Production, GCP via nginx-ingress (rewrites to /api/v1)
  - url: http://localhost:5553/api/v1
    description: Local, straight at the service, bypassing the gateway

security:
  - bearerAuth: []

tags:
  - name: Messages
    description: Send, read, and delete user-to-user messages.

paths:
  /messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message
      description: |
        Sends a message from the authenticated user to `receiverEmail`.

        The service overwrites `senderEmail` with the JWT `email` claim and `createdTime` with the
        server clock, then persists. `id` and `read` in the request body are ignored entirely: the
        id is generated and `read` always starts false.

        `senderEmail` carries no constraint, so a value the server is about to discard can never
        make the request fail. Omit it; anything you send is replaced by the JWT `email` claim.

        `receiverEmail` is validated for shape and nothing more. No identity realm is consulted, so an
        address nobody owns is stored like any other and the sender sees a `201`. There is no `404`
        and no `503` on this endpoint.

        Requires the realm role `user` or `admin`.
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageDTO"
            example:
              receiverEmail: "owner@example.com"
              text: "Hello, I am interested in your offer. Is the room available for August?"
      responses:
        "201":
          description: Message stored. The body is the persisted message with its generated id.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDTO"
              example:
                id: "c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
                text: "Hello, I am interested in your offer. Is the room available for August?"
                receiverEmail: "owner@example.com"
                senderEmail: "traveller@example.com"
                createdTime: "14:30:00 15.08.2024"
                read: false
        "400":
          description: |
            Bean Validation rejected the payload. `text` is blank or over 65000 characters, or
            `receiverEmail` is blank, not an email address, or over 255 characters. A malformed
            `senderEmail` is not a reason: the server assigns that field and never reads it.

            A payload that passes validation and still carries a character PostgreSQL cannot encode,
            such as the JSON escape for NUL, is rejected here too rather than failing at the database.
            That case carries no `field-errors`, because the database names a bind position rather
            than a field.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                validationFailure:
                  summary: Bean Validation rejected the payload
                  value:
                    title: "Bad Request"
                    status: 400
                    detail: "Validation failed"
                    instance: "/api/v1/messages"
                    field-errors:
                      receiverEmail: "must not be blank"
                unstorableCharacter:
                  summary: text carried the JSON escape for NUL
                  value:
                    title: "Bad Request"
                    status: 400
                    detail: "A text field contains a character the database cannot store, such as the NUL character U+0000. Remove it and send the request again."
                    instance: "/api/v1/messages"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/ServerError"

  /messages/received:
    get:
      tags: [Messages]
      operationId: getReceivedMessages
      summary: List messages addressed to the authenticated user
      description: |
        Returns a page of the messages whose `receiverEmail` equals the `email` claim of the
        caller's JWT. Never returns another user's inbox, and there is no way to ask for one.

        Reading a message does not mark it read. `read` stays false; nothing in this API sets it.

        Requires the realm role `user` or `admin`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of received messages. `content` is empty when the inbox is empty.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfMessageDTO"
              example:
                content:
                  - id: "c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
                    text: "Hello, I am interested in your offer. Is the room available for August?"
                    receiverEmail: "owner@example.com"
                    senderEmail: "traveller@example.com"
                    createdTime: "14:30:00 15.08.2024"
                    read: false
                totalElements: 1
                totalPages: 1
                size: 20
                number: 0
                first: true
                last: true
                numberOfElements: 1
                empty: false
        "400":
          $ref: "#/components/responses/UnknownSortProperty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /messages/sent:
    get:
      tags: [Messages]
      operationId: getSentMessages
      summary: List messages sent by the authenticated user
      description: |
        Returns a page of the messages whose `senderEmail` equals the `email` claim of the caller's
        JWT.

        Requires the realm role `user` or `admin`.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: A page of sent messages. `content` is empty when the user has sent none.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageOfMessageDTO"
              example:
                content:
                  - id: "c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
                    text: "Hello, I am interested in your offer. Is the room available for August?"
                    receiverEmail: "owner@example.com"
                    senderEmail: "traveller@example.com"
                    createdTime: "14:30:00 15.08.2024"
                    read: false
                totalElements: 1
                totalPages: 1
                size: 20
                number: 0
                first: true
                last: true
                numberOfElements: 1
                empty: false
        "400":
          $ref: "#/components/responses/UnknownSortProperty"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/ServerError"

  /messages/{messageId}:
    delete:
      tags: [Messages]
      operationId: deleteMessage
      summary: Delete a message
      description: |
        Deletes the message. The caller must be either its sender or its receiver, both compared
        against the JWT `email` claim. Any other authenticated caller gets 403.

        The delete is absolute: it removes the message for both parties, not just for the caller.

        Returns 204 with an empty body. Nothing is echoed back.

        Requires the realm role `user` or `admin`.
      parameters:
        - name: messageId
          in: path
          required: true
          description: Identifier of the message to delete.
          schema:
            type: string
            format: uuid
          example: "c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: Message deleted. Empty body.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
        "400":
          description: |
            `messageId` is not a UUID.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: "Bad Request"
                status: 400
                detail: "Failed to convert 'messageId' with value: 'not-a-uuid'"
                instance: "/api/v1/messages/not-a-uuid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            Either the token carries no `user` or `admin` realm role, which Spring Security answers
            with an empty body, or the caller is neither the sender nor the receiver of this message,
            which the service answers with the problem detail below.

            The detail names neither the caller nor any other party: a denial is never a place to
            hand out an email address.
          headers:
            WWW-Authenticate:
              description: |
                Bearer challenge with `error="insufficient_scope"`. Present only on the realm-role
                denial, absent when the service itself refused the operation.
              schema:
                type: string
              example: 'Bearer error="insufficient_scope", error_description="The request requires higher privileges than provided by the access token."'
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: "Forbidden"
                status: 403
                detail: "You are neither the sender nor the receiver of this message."
                instance: "/api/v1/messages/c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
        "404":
          description: No message with that id exists.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              example:
                title: "Not Found"
                status: 404
                detail: "Message with ID: c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb not found."
                instance: "/api/v1/messages/c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Keycloak-issued access token, validated by the service itself as an OAuth2 resource server
        against the issuer in `OAUTH2_ISSUER_URI`. Locally that is
        `https://keycloak.test:9443/realms/sky`, in production
        `https://keycloak.luksarna.com/realms/sky`.

        Mint one with the password grant against
        `{issuer}/protocol/openid-connect/token` using the `sky-backend` client, or with the
        client-credentials grant for machine callers. Tokens live 300 seconds.

        Two claims matter:

        - `email` identifies the acting user and becomes the `senderEmail` of anything sent. A token
          without it fails the request. The Keycloak realm needs the email mapper on the client
          scope.
        - `realm_access.roles` carries the realm roles. `KeycloakRealmRoleConverter` uppercases each
          one and prefixes `ROLE_`, so realm role `user` becomes `ROLE_USER`. Every operation here
          requires `user` or `admin`.

  headers:
    CorrelationId:
      description: |
        Echo of the request's `X-Correlation-Id`, or a freshly generated UUID when the request did
        not carry one. Present on every response, including errors. Quote it in a bug report.
      schema:
        type: string
      example: "0d6d4e3b-2c9a-4e77-b0a1-7b4c5d6e7f80"

  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    Size:
      name: size
      in: query
      required: false
      description: |
        Page size. Defaults to 20 when omitted and is capped server-side at 2000; a larger value is
        silently reduced rather than rejected.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 20
      example: 20
    Sort:
      name: sort
      in: query
      required: false
      description: |
        Spring Data sort expression, `property,(asc|desc)`, for example `createdTime,desc`. Repeat
        the parameter for a multi-property sort. Sortable properties are the persisted `Message`
        fields: `id`, `text`, `createdTime`, `isRead`, `receiverEmail`, `senderEmail`. Note that
        the sort key for the read flag is `isRead`, the entity field, not the `read` field name the
        JSON uses. Unsorted by default, so page order is not guaranteed stable without a `sort`.

        A property the entity does not have is a 400. `SpringDataExceptionHandler` in sky-common
        turns Spring Data's `PropertyReferenceException` into a problem detail whose `detail` names
        the offending property, for example `Unknown sort property 'createdTimee'.`
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example: ["createdTime,desc"]
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Optional request correlation id. When absent the service generates a UUID. Either way the
        value is echoed on the response and stamped on every log line for the request.
      schema:
        type: string
      example: "0d6d4e3b-2c9a-4e77-b0a1-7b4c5d6e7f80"

  schemas:
    MessageDTO:
      type: object
      description: |
        A message. The same type is the request body of `POST /messages` and the response body of
        every operation that returns one. Null fields are serialized as `null` rather than omitted.

        On the way in only `receiverEmail` and `text` are honoured. `id`, `senderEmail`,
        `createdTime`, and `read` are set or ignored server-side, which is why they are marked
        read-only here, and none of them carries a constraint that could reject a request.
      required:
        - receiverEmail
        - text
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Message identifier, generated by the database (`GenerationType.UUID`).
          example: "c4e1a9d7-2b83-4f60-9d15-7ae3c802f4bb"
        text:
          type: string
          minLength: 1
          maxLength: 65000
          description: |
            The message body. `@NotBlank` and `@Size(max = 65000)`, so a blank, whitespace-only, or
            absent value is rejected at the API boundary with a 400 and a `field-errors` entry on
            `text`.
          example: "Hello, I am interested in your offer. Is the room available for August?"
        receiverEmail:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: |
            Address of the recipient. `@NotBlank`, `@Email`, and `@Size(max = 255)`, matching the
            column width. Not checked against any user directory, so an address nobody owns is
            accepted and the message is simply never read.
          example: "owner@example.com"
        senderEmail:
          type: string
          format: email
          readOnly: true
          description: |
            Address of the sender, overwritten from the JWT `email` claim. Sending it is pointless
            and harmless: the field carries no constraint, so a malformed value is discarded rather
            than rejected.
          example: "traveller@example.com"
        createdTime:
          type: string
          pattern: "^\\d{2}:\\d{2}:\\d{2} \\d{2}\\.\\d{2}\\.\\d{4}$"
          readOnly: true
          description: |
            When the message was sent, formatted `HH:mm:ss dd.MM.yyyy` in the `Europe/Warsaw` zone.
            Not ISO-8601, and carries no zone offset in the string itself. Set from the server clock
            and ignored if supplied.
          example: "14:30:00 15.08.2024"
        read:
          type: boolean
          readOnly: true
          description: |
            Whether the recipient has read the message. Always false today: nothing in this API
            marks a message read, and reading the inbox does not change it.
          example: false

    PageOfMessageDTO:
      type: object
      description: |
        Spring Data `Page<MessageDTO>`, serialized directly by Jackson. The fields below are the
        stable part of the envelope. The serialization also emits Spring Data internals such as
        `pageable` and `sort`; treat those as framework detail and do not build against them.
      additionalProperties: true
      required:
        - content
        - totalElements
        - totalPages
        - size
        - number
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/MessageDTO"
        totalElements:
          type: integer
          format: int64
          description: Total number of messages matching the query across every page.
          example: 12
        totalPages:
          type: integer
          format: int32
          example: 1
        size:
          type: integer
          format: int32
          description: Requested page size.
          example: 20
        number:
          type: integer
          format: int32
          description: Zero-based index of this page.
          example: 0
        first:
          type: boolean
          example: true
        last:
          type: boolean
          example: true
        numberOfElements:
          type: integer
          format: int32
          description: Number of entries in `content` on this page.
          example: 12
        empty:
          type: boolean
          example: false

    ProblemDetail:
      type: object
      description: |
        RFC 9457 problem detail, served as `application/problem+json`. Produced by
        `SkyRestExceptionHandler` in sky-common for framework and validation failures,
        `SpringDataExceptionHandler` in sky-common for an unknown sort property and for a value the
        database cannot store (both 400), and `GlobalExceptionHandler` in this service for `MessageException` (400),
        `MessageAccessDeniedException` (403), and `MessageNotFoundException` (404).
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            Absent from every response the services send. Spring Framework 7 leaves the member unset,
            and RFC 9457 says a consumer assumes `about:blank` when it is absent. The services publish
            no per-problem type URIs, so branch on `status` plus the presence of `field-errors`.
        title:
          type: string
          description: Reason phrase of the status code, for example `Bad Request` or `Not Found`.
          example: "Bad Request"
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated in the body.
          example: 400
        detail:
          type: string
          description: |
            What went wrong on this occurrence. Bean Validation failures always use the fixed string
            `Validation failed` and put the per-field messages in `field-errors`. Domain failures put
            the exception message here.
          example: "Validation failed"
        instance:
          type: string
          format: uri-reference
          description: |
            Path of the request that failed, as the service saw it after the gateway rewrite. It is
            `/api/v1/...`, not the `/msg/api/...` path the caller used.
          example: "/api/v1/messages"
        field-errors:
          type: object
          description: |
            Present only on a Bean Validation failure. One entry per rejected field, keyed by the
            field name, valued with the constraint message. The key is the property path Spring
            reports, so a nested field appears as `parent.child`.
          additionalProperties:
            type: string
          example:
            receiverEmail: "must not be blank"

    ServerErrorBody:
      type: object
      description: |
        Spring Boot's default error body, rendered by `BasicErrorController` for any exception the
        shared handlers decline. It is not an RFC 9457 problem detail and it is not served as
        `application/problem+json`, which is the one inconsistency in this API's error contract.
      required:
        - timestamp
        - status
        - error
        - path
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the failure was rendered, in UTC.
          example: "2026-09-11T07:11:30.719Z"
        status:
          type: integer
          format: int32
          description: The HTTP status code, repeated in the body.
          example: 500
        error:
          type: string
          description: Reason phrase of the status code.
          example: "Internal Server Error"
        path:
          type: string
          format: uri-reference
          description: |
            Path of the request that failed, as the service saw it after the gateway rewrite. It is
            the same value a problem detail carries in `instance`.
          example: "/api/v1/messages"

  responses:
    UnknownSortProperty:
      description: |
        The `sort` parameter names a property the entity does not have. `SpringDataExceptionHandler`
        in sky-common turns the `PropertyReferenceException` Spring Data raises into the problem
        detail below. The `detail` quotes the property only when the name is made of letters, digits,
        underscores, and dots; any other name is described generically, so nothing a caller sent is
        reflected back. `instance` is the path of the request that failed, so it reads
        `/api/v1/messages/sent` on the sent list.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            unknownProperty:
              summary: sort named a property the entity does not have
              value:
                title: "Bad Request"
                status: 400
                detail: "Unknown sort property 'createdTimee'."
                instance: "/api/v1/messages/received"
            unquotableProperty:
              summary: The property name was not safe to quote back
              value:
                title: "Bad Request"
                status: 400
                detail: "The requested sort property is not a sortable property of this resource."
                instance: "/api/v1/messages/received"

    Unauthorized:
      description: |
        No bearer token, or a token that failed signature, issuer, expiry, or audience validation.
        The body is empty; Spring Security's `BearerTokenAuthenticationEntryPoint` answers with the
        status and a `WWW-Authenticate` header only.
      headers:
        WWW-Authenticate:
          description: |
            Bearer challenge. With no token it carries the `resource_metadata` link Spring Security 7
            advertises; with a token that failed validation it carries `error` and
            `error_description` instead.
          schema:
            type: string
          example: 'Bearer resource_metadata="https://skycloud.luksarna.com/.well-known/oauth-protected-resource"'
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"

    Forbidden:
      description: |
        The token is valid but carries neither the `user` nor the `admin` realm role, so
        `@PreAuthorize("hasAnyRole('USER','ADMIN')")` denied the call. The body is empty.

        A denial raised by the service itself rather than by the role check carries a problem detail.
        That case is documented on the operation it applies to.
      headers:
        WWW-Authenticate:
          description: Bearer challenge with `error="insufficient_scope"`.
          schema:
            type: string
          example: 'Bearer error="insufficient_scope", error_description="The request requires higher privileges than provided by the access token."'
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"

    UnsupportedMediaType:
      description: The request body was not sent as `application/json`.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          example:
            title: "Unsupported Media Type"
            status: 415
            detail: "Content-Type 'text/plain' is not supported."
            instance: "/api/v1/messages"

    ServerError:
      description: |
        Unexpected failure. This is the one error on this API that is not a problem detail: the shared
        handlers turn the failures they recognise into `application/problem+json`, and everything they
        decline falls through to Spring Boot's default error handling, which answers
        `application/json` with the object below. Branch on the status and the `Content-Type`, never
        on the body alone.

        The body carries no exception message, no constraint name, and no SQL, so there is nothing in
        it to act on. Treat a 500 as opaque, retry once, and quote the `X-Correlation-Id` when
        reporting it.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServerErrorBody"
          example:
            timestamp: "2026-09-11T07:11:30.719Z"
            status: 500
            error: "Internal Server Error"
            path: "/api/v1/messages"
