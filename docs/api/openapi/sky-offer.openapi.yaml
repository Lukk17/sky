components:
  schemas:
    OfferDTO:
      type: object
      properties:
        city:
          type: string
          maxLength: 255
          minLength: 0
        comment:
          type: string
          maxLength: 1000
          minLength: 0
        country:
          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 3000
          minLength: 0
        externalPhotoUrl:
          type: string
        hotelName:
          type: string
          maxLength: 255
          minLength: 0
        id:
          type: string
          format: uuid
        ownerEmail:
          type: string
        photoUrl:
          type: string
        price:
          type: number
          minimum: 0
        roomCapacity:
          type: integer
          format: int64
          minimum: 1
      required:
      - city
      - country
      - hotelName
      - price
      - roomCapacity
    OfferEditDTO:
      type: object
