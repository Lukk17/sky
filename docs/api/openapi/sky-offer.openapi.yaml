          type: string
          maxLength: 255
          minLength: 0
        description:
          type: string
          maxLength: 3000
          minLength: 0
        externalPhotoUrl:
          type: string
        hotelName:
          type: string
          maxLength: 255
          minLength: 0
        id:
          type: string
          format: uuid
        ownerEmail:
          type: string
        price:
          type: number
          minimum: 0
        roomCapacity:
          type: integer
          format: int64
          minimum: 1
      required:
      - id
    Page:
      type: object
      properties:
        content:
          type: array
          items: {}
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
