info:
  name: Get Gateway Session
  type: http
  seq: 17

http:
  method: GET
  url: "{{gatewayUrl}}/api/session"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.email
      operator: isDefined
    - expression: res.body.csrfToken
      operator: isDefined
    - expression: res.body.logoutUrl
      operator: isDefined
    - expression: res.body.logoutUrl
      operator: contains
      value: "openid-connect/logout"