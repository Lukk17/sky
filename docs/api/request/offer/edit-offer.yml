info:
  name: Edit Offer
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/offer/api/owner/offers"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "{{offerId}}",
        "hotelName": "Grand Hotel Paris (Renovated)",
        "description": "Freshly renovated rooms with panoramic city views.",
        "comment": "Breakfast and spa access included.",
        "price": 299.99,
        "roomCapacity": 2,
        "city": "Paris",
        "country": "France",
        "photoPath": "/images/grand-hotel-paris-new.jpg"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.hotelName
      operator: eq
      value: "Grand Hotel Paris (Renovated)"
    - expression: res.body.price
      operator: eq
      value: "299.99"
    - expression: res.body.ownerEmail
      operator: eq
      value: "lukk@sky.dev"
