info:
  name: Edit Offer
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/owner/offers"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": "{{offerId}}",
        "hotelName": "Grand Hotel Paris (Renovated)",
        "description": "Freshly renovated rooms with panoramic city views.",
        "comment": "Breakfast and spa access included.",
        "price": 299.99,
        "roomCapacity": 2,
        "city": "Paris",
        "country": "France",
        "externalPhotoUrl": "https://images.example.com/grand-hotel-paris-new.jpg"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const marker = "SKY-OFFER-PHOTO-CANARY-4471";
        const markerHex = marker.split("").map(function (c) { return ("0" + c.charCodeAt(0).toString(16)).slice(-2); }).join("");
        bru.setVar("photoStatusAfterEdit", 0);
        bru.setVar("photoCanaryAfterEdit", "photo address was not fetched");
        if (res.status === 200 && res.body && res.body.photoUrl) {
          bru.setVar("storedPhotoUrl", res.body.photoUrl);
          try {
            const stored = await bru.sendRequest({
              method: "GET",
              url: res.body.photoUrl,
              responseType: "text",
              responseEncoding: "hex"
            });
            bru.setVar("photoStatusAfterEdit", stored.status);
            bru.setVar("photoCanaryAfterEdit", String(stored.data).indexOf(markerHex) === -1
              ? "stored object carries no canary marker"
              : marker);
          } catch (err) {
            bru.setVar("photoStatusAfterEdit", (err && err.status) || 0);
            bru.setVar("photoCanaryAfterEdit", "photo address not fetchable: " + ((err && err.message) || "unknown error"));
          }
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.hotelName
      operator: eq
      value: "Grand Hotel Paris (Renovated)"
    - expression: res.body.price
      operator: eq
      value: "299.99"
    - expression: res.body.ownerEmail
      operator: eq
      value: "lukk@sky.dev"
    - expression: res.body.externalPhotoUrl
      operator: eq
      value: "https://images.example.com/grand-hotel-paris-new.jpg"
    - expression: res.body.photoUrl
      operator: contains
      value: "X-Amz-Algorithm"
    - expression: res.body.photoPath
      operator: isUndefined
    - expression: photoStatusAfterEdit
      operator: eq
      value: "200"
    - expression: photoCanaryAfterEdit
      operator: eq
      value: "SKY-OFFER-PHOTO-CANARY-4471"
