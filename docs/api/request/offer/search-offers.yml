info:
  name: Search Offers (public)
  type: http
  seq: 3

http:
  method: GET
  url: "{{offerUrl}}/api/v1/search?term=Paris"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isDefined
    - expression: res.body.totalElements
      operator: isDefined
    - expression: res.body.totalElements
      operator: gte
      value: "1"
