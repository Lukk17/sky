info:
  name: Search Offers (public)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/offer/api/search"
  auth:
    type: none
  headers:
    - name: Content-Type
      value: text/plain
    - name: Accept
      value: application/json
  body:
    type: text
    data: Paris

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
