info:
  name: Get All Offers (public)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/offer/api/offers?page=0&size=20"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isDefined
    - expression: res.body.totalElements
      operator: isDefined
