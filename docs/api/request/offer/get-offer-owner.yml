info:
  name: Get Offer Owner
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/offer/api/offers/{{offerId}}/owner"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: eq
      value: "lukk@sky.dev"
