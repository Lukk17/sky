info:
  name: Get Owned Offers
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/offer/api/owner/offers?page=0&size=20"
  auth:
    type: none
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isDefined
