info:
  name: Get Offer By Id
  type: http
  seq: 15

http:
  method: GET
  url: "{{offerUrl}}/api/v1/offers/{{offerId}}"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: eq
      value: "{{offerId}}"
    - expression: res.body.hotelName
      operator: eq
      value: "Grand Hotel Paris (Renovated)"
    - expression: res.body.city
      operator: eq
      value: "Paris"
    - expression: res.body.country
      operator: eq
      value: "France"
    - expression: res.body.roomCapacity
      operator: eq
      value: "2"
    - expression: res.body.price
      operator: eq
      value: "299.99"
    - expression: res.body.ownerEmail
      operator: eq
      value: "lukk@sky.dev"
    - expression: res.body.externalPhotoUrl
      operator: eq
      value: "https://images.example.com/grand-hotel-paris-new.jpg"
    - expression: res.body.photoUrl
      operator: contains
      value: "X-Amz-Algorithm"
    - expression: res.body.photoPath
      operator: isUndefined
    - expression: res.body.photoObjectKey
      operator: isUndefined
    - expression: res.body.gallery
      operator: isDefined
    - expression: res.body.gallery.length
      operator: eq
      value: "1"
    - expression: res.body.gallery[0].id
      operator: eq
      value: "{{galleryPhotoId2}}"
    - expression: res.body.gallery[0].position
      operator: eq
      value: "0"
    - expression: res.body.gallery[0].url
      operator: contains
      value: "X-Amz-Algorithm"
    - expression: res.body.coverPhotoUrl
      operator: contains
      value: "X-Amz-Algorithm"