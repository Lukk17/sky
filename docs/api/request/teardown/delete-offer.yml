info:
  name: Delete Offer
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/offer/api/owner/offers/{{offerId}}"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
