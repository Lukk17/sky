info:
  name: Delete Booking
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/booking/api/bookings/1"
  auth:
    type: none
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
