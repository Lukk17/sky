info:
  name: Delete Booking
  type: http
  seq: 1

http:
  method: DELETE
  url: "{{baseUrl}}/booking/api/bookings/{{bookingId}}"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
