info:
  name: Delete Message
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/msg/api/messages/{{messageId}}"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
