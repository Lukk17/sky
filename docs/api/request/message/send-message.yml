info:
  name: Send Message
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/msg/api/messages"
  auth:
    type: none
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "text": "Hello, I am interested in your offer for Grand Hotel Paris. Is the room available for August?",
        "receiverEmail": "owner@example.com"
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.id
      operator: isDefined
    - expression: res.body.senderEmail
      operator: isDefined
    - expression: res.body.receiverEmail
      operator: isDefined
