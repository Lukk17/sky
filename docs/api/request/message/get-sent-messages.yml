info:
  name: Get Sent Messages
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/msg/api/messages/sent?page=0&size=20"
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isDefined
    - expression: res.body.totalElements
      operator: isDefined
    - expression: res.body.totalElements
      operator: gte
      value: "1"
