info:
  name: Get Received Messages
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/msg/api/messages/received?page=0&size=20"
  auth:
    type: none
  headers:
    - name: Authorization
      value: "Bearer {{bearerToken}}"
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: isDefined
    - expression: res.body.totalElements
      operator: isDefined
