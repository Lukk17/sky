# Self-driving collection: run "Get Token (Keycloak)" (seq 1) once and its post-response
# script fills bearerToken below automatically. A full-collection run does this for you.
# Tokens are short-lived (typically 5 minutes); re-run "Get Token" when you receive a 401.
#
# keycloakUrl points at the realm issuer host. Locally the sky realm is reachable on
# http://localhost:8080 (same host the gateway listens on); the realm path /realms/sky is
# appended by the request. The dev client/user below match config/keycloak/sky-realm.json.
name: local
variables:
  - name: baseUrl
    value: http://localhost:8080
  - name: keycloakUrl
    value: http://localhost:8080
  - name: keycloakClientId
    value: sky-backend
  - name: keycloakClientSecret
    value: dev-only-change-in-prod
    secret: true
  - name: keycloakUsername
    value: owner
  - name: keycloakPassword
    value: owner
    secret: true
  - name: bearerToken
    value: ""
    secret: true
