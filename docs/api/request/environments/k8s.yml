# In-cluster Kubernetes environment (k3d, minikube, kind, or any distro).
# Targets the stack through the cluster ingress: host port 5777 → ingress port 80.
# Keycloak hostname uses nip.io so the host resolves it to 127.0.0.1
# without requiring a hosts file entry. CoreDNS inside the cluster
# routes that hostname to the nginx-ingress ClusterIP so services
# can reach Keycloak for JWKS validation.
#
# Any Kubernetes distro works with this same environment as long as its ingress
# is exposed at localhost:5777 and its Keycloak issues the same nip.io issuer.
#
# offer/upload-photo.yml fetches the presigned photoUrl back. The cluster signs that URL against
# s3.presignEndpoint in config/k8s/helm/service/sky-offer/values-local.yaml, which is
# http://s3.localhost:5777, the floci ingress on the same host port the rest of the stack answers on.
# The upload itself goes to s3.endpoint, http://floci-service:4566, which only resolves inside the
# cluster. Both round-trip assertions pass here.
#
# bookingUrl, offerUrl and messageUrl all hold the one cluster ingress address. Nothing is rewritten at the
# edge, so the three only ever differ in the direct environment, where each names its own service port.
# mintToken is true here, so auth/get-token.yml runs and fills bearerToken.
#
# Run the collection with:
#   bru run -r --env k8s --insecure
# from the docs/api/request directory. Running a single folder needs the token passed in, because
# auth/get-token.yml is what fills bearerToken:
#   bru run offer -r --env k8s --insecure --env-var bearerToken=<token>
name: k8s
variables:
  - name: bookingUrl
    value: http://localhost:5777
  - name: offerUrl
    value: http://localhost:5777
  - name: messageUrl
    value: http://localhost:5777
  - name: mintToken
    value: "true"
  - name: keycloakUrl
    value: http://keycloak.127.0.0.1.nip.io:5777
  - name: keycloakClientId
    value: sky-backend
  - name: keycloakClientSecret
    value: dev-only-change-in-prod
  - name: keycloakUsername
    value: lukk
  - name: keycloakPassword
    value: test1234
  - name: bearerToken
    value: ""
    secret: true
