# Self-contained end-to-end stack from config/docker/docker-compose.ci.yaml, reached from inside
# the compose network rather than from the host. Every hostname below is a compose service name,
# so the collection resolves exactly what the services resolve: the token is minted from the same
# issuer string the services validate against (http://keycloak:8080/realms/sky), and the presigned
# photoUrl sky-offer signs against http://floci:4566 is fetchable unchanged.
#
# Everything is plain HTTP on that network, so this is the one environment that needs no
# --insecure: there is no certificate, no hosts file entry and no host port in the path.
#
# bookingUrl, offerUrl and messageUrl all hold the one gateway address. Nothing is rewritten at the
# edge, so the three only ever differ in the direct environment, where each names its own service port.
# mintToken is true here, so auth/get-token.yml runs and fills bearerToken.
#
# Run it through the bruno service, which is on that network and already carries the CLI:
#   docker compose -p sky-e2e -f config/docker/docker-compose.ci.yaml up -d --build --wait
#   docker compose -p sky-e2e -f config/docker/docker-compose.ci.yaml run --rm bruno
#
# The service runs `bru run -r --env ci` for you. The --env flag takes the file name, ci, while
# the name below is what the Bruno desktop app shows. Running this environment from the host or
# from the desktop app will not work: none of these names resolve outside the compose network.
name: sky-e2e
variables:
  - name: bookingUrl
    value: http://sky-gateway:5777
  - name: offerUrl
    value: http://sky-gateway:5777
  - name: messageUrl
    value: http://sky-gateway:5777
  - name: mintToken
    value: "true"
  - name: keycloakUrl
    value: http://keycloak:8080
  - name: keycloakClientId
    value: sky-backend
  - name: keycloakClientSecret
    value: dev-only-change-in-prod
  - name: keycloakUsername
    value: lukk
  - name: keycloakPassword
    value: test1234
  - name: bearerToken
    value: ""
    secret: true
