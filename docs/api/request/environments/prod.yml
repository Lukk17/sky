# Self-driving collection: run "Get Token (Keycloak)" (seq 1) once and its post-response
# script fills bearerToken below automatically. A full-collection run does this for you.
# Tokens are short-lived (typically 5 minutes); re-run "Get Token" when you receive a 401.
#
# Fill keycloakClientSecret, keycloakUsername and keycloakPassword with real prod credentials
# before running protected requests; they are intentionally left blank here.
name: prod
variables:
  - name: baseUrl
    value: https://skycloud.luksarna.com
  - name: keycloakUrl
    value: https://keycloak.luksarna.com
  - name: keycloakClientId
    value: sky-backend
  - name: keycloakClientSecret
    value: ""
    secret: true
  - name: keycloakUsername
    value: ""
  - name: keycloakPassword
    value: ""
    secret: true
  - name: bearerToken
    value: ""
    secret: true
