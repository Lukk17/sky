[versions]
# Framework — Spring Boot version. Bump to 4.x with the SB4 migration guide in hand;
# extensive package moves (spring-boot-test autoconfigure split, Jackson 3 ->
# tools.jackson, web autoconfigure module split) need targeted triage. The catalog is
# otherwise SB4-ready: JDK 25 toolchain is live, @MockitoBean is in place, jacoco
# 0.8.13 supports class file version 69 (Java 25).
spring-boot = "3.5.4"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.0.3"

# Java toolchain — auto-downloaded by the Foojay resolver convention plugin declared
# in root settings.gradle.kts. Single source of truth: bumping here propagates to
# every module via sky.java-conventions.
java = "21"

# Persistence
flyway = "10.20.0"

# Tooling
lombok = "1.18.38"
springdoc = "2.6.0"
resilience4j = "2.2.0"

# Test
junit-jupiter = "5.11.0"
mockwebserver = "4.12.0"
archunit = "1.3.0"
# Testcontainers 2.x is required to talk to Docker Engine 29+ (TC 1.x fails the /info
# handshake with HTTP 400). Forced over the Spring Boot 3.5.4 BOM (which pins 1.21.3)
# via sky.spring-service-conventions until the Spring Boot 4 flip makes 2.x the managed default.
testcontainers = "2.0.5"

[libraries]
# Spring Boot starters (versions managed by Spring Boot BOM via dependency-management plugin)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-rest = { module = "org.springframework.boot:spring-boot-starter-data-rest" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Spring Cloud Gateway (local-dev edge proxy, not used in production)
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }

# Spring messaging
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Spring security / test
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-test = { module = "org.springframework:spring-test" }

# Persistence + serdes
mysql-connector-j = { module = "com.mysql:mysql-connector-j" }
gson = { module = "com.google.code.gson:gson" }
h2 = { module = "com.h2database:h2" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }

# JAX-B (JDK 9+ Hibernate/Hikari compatibility)
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime" }

# Versioned (not BOM-managed)
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
spring-boot-starter-aop = { module = "org.springframework.boot:spring-boot-starter-aop" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[bundles]
jaxb = ["jakarta-xml-bind-api", "jaxb-runtime"]
