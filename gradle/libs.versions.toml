[versions]
# Framework — Spring Boot 4 / Spring Framework 7 / Spring Cloud 2025.1.x (Oakwood).
spring-boot = "4.0.7"
aws-sdk = "2.28.29"
spring-dependency-management = "1.1.7"
spring-cloud = "2025.1.2"

# Java toolchain — auto-downloaded by the Foojay resolver convention plugin declared
# in root settings.gradle.kts. Single source of truth: bumping here propagates to
# every module via sky.java-conventions. The Gradle daemon itself stays on JDK 21
# (pinned in gradle/gradle-daemon-jvm.properties) and compiles to 25 via the toolchain.
java = "25"

# Tooling
lombok = "1.18.38"
springdoc = "3.0.3"
resilience4j = "2.4.0"

# Test
junit-jupiter = "5.11.0"
mockwebserver = "4.12.0"
archunit = "1.4.2"
# Testcontainers 2.x is required to talk to Docker Engine 29+ (TC 1.x fails the /info
# handshake with HTTP 400). Spring Boot 4 BOM manages 2.x; the explicit pin here keeps
# the build deterministic and ensures the force in sky.spring-service-conventions is a no-op.
testcontainers = "2.0.5"

[libraries]
# Spring Boot starters (versions managed by Spring Boot BOM via dependency-management plugin)
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-rest = { module = "org.springframework.boot:spring-boot-starter-data-rest" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-websocket = { module = "org.springframework.boot:spring-boot-starter-websocket" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# Spring Cloud Gateway (local-dev edge proxy, not used in production)
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
# Spring Cloud Gateway 5.0 (Oakwood) renamed the reactive starter to the WebFlux server variant.
spring-cloud-starter-gateway-server-webflux = { module = "org.springframework.cloud:spring-cloud-starter-gateway-server-webflux" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }

# Spring messaging. Boot 4 moved Kafka auto-configuration into spring-boot-kafka, pulled by
# the spring-boot-starter-kafka starter (which also brings spring-kafka). sky-common keeps the
# bare spring-kafka as compileOnly so it does not force the starter onto non-Kafka consumers.
spring-boot-starter-kafka = { module = "org.springframework.boot:spring-boot-starter-kafka" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# Spring security / test
spring-security-test = { module = "org.springframework.security:spring-security-test" }
spring-test = { module = "org.springframework:spring-test" }

# Boot 4 split the slice-test autoconfigure out of spring-boot-starter-test into per-technology
# modules; services opt in to the slices they actually use.
spring-boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
spring-boot-resttestclient = { module = "org.springframework.boot:spring-boot-resttestclient" }
# TestRestTemplate's auto-config needs RestTemplateBuilder, which Boot 4 moved into spring-boot-restclient.
spring-boot-restclient = { module = "org.springframework.boot:spring-boot-restclient" }
spring-boot-data-jpa-test = { module = "org.springframework.boot:spring-boot-data-jpa-test" }
spring-boot-jdbc-test = { module = "org.springframework.boot:spring-boot-jdbc-test" }

# Persistence + serdes
postgresql = { module = "org.postgresql:postgresql" }
gson = { module = "com.google.code.gson:gson" }
h2 = { module = "com.h2database:h2" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# JAX-B (JDK 9+ Hibernate/Hikari compatibility)
jakarta-xml-bind-api = { module = "jakarta.xml.bind:jakarta.xml.bind-api" }
jaxb-runtime = { module = "org.glassfish.jaxb:jaxb-runtime" }

# AWS SDK v2 — BOM + S3 client
awssdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
awssdk-s3 = { module = "software.amazon.awssdk:s3" }

# Versioned (not BOM-managed)
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
resilience4j-spring-boot4 = { module = "io.github.resilience4j:resilience4j-spring-boot4", version.ref = "resilience4j" }
# Spring Boot 4 removed spring-boot-starter-aop; aspectjweaver (BOM-managed) plus Spring's
# AopAutoConfiguration provide the @Aspect proxying that resilience4j's annotations need.
aspectjweaver = { module = "org.aspectj:aspectjweaver" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }

[bundles]
jaxb = ["jakarta-xml-bind-api", "jaxb-runtime"]
