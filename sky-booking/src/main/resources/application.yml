# ==================================================================================================================
sky:
  helloWorld: <center><h1>Welcome to Booking app.</h1></center>
  apiPrefix: /api/v1
  offerServiceHostname: ${OFFER_SERVICE_HOSTNAME:sky-offer-service}
  offerServiceHostPort: ${OFFER_SERVICE_HOST_PORT:}
  offerOwnerEndpoint: api/internal/owner/offer
  crossOrigin:
    allowed: ${ACCESS_CONTROL_ALLOW_ORIGIN:https://skycloud.luksarna.com}

# SPRING setup

server:
  port: ${BOOKING_PORT:5555}
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: '/swagger-ui.html'
    urls:
      - url: ${SWAGGER_URL:/v3/api-docs/public}
        name: Booking API doc

spring:
  application:
    name: sky-booking
  web:
    # location from http header
    locale-resolver: accept_header
  mvc:
    # for option request handling
    dispatch-options-request: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    # validate: schema must match entities; migrations own evolution.
    hibernate.ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: ${SHOW_SQL_QUERIES:false}
    properties:
      hibernate:
        jdbc:
          # If DB timezone is set to UTC and it differ with your current then it will save date wrong
          # Example: 2020-03-28 was saved as 2020-03-27
          time_zone: Europe/Warsaw

  # IMPORTANT#1 : DOCKER OVERWRITE IT, SO TO CHANGE THIS VALUES YOU NEED TO CHANGE DOCKER .env FILE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/sky}
    hikari:
      connection-timeout: 60000
      validation-timeout: 60000
      #      instead of adding as DB URL parameter:
      data-source-properties:
        useUnicode: true
        characterEncoding: UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: ${KAFKA_ADDRESS:kafka-service}:${KAFKA_PORT:9092}
    producer:
      client-id: bookingService
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Production durability (acks=all, idempotence, retries, in-flight cap, delivery
      # timeout) is supplied via env vars in the Helm values file rather than committed
      # defaults; the prod-profile env injects SPRING_KAFKA_PRODUCER_* keys. Keeping the
      # defaults Spring-Kafka-stock here so EmbeddedKafka integration tests keep working
      # until Testcontainers MySQL+Kafka replaces them (test-modernization).
    admin:
      auto-create: true

# expose actuator endpoints (* for all)
management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org:
      springframework:
        web: ${SPRING_DEBUG:INFO}
      hibernate: ${HIBERNATE_DEBUG:WARN}
      apache:
        kafka:
          clients:
            admin:
              AdminClientConfig: WARN
            producer:
              ProducerConfig: WARN

