# ==================================================================================================================
sky:
  apiPrefix: api/v1
#  Need to be http:// because without a port, the WebClient defaults to using HTTP.
#  However, when you specify a port (even if it's port 80, which is the default for HTTP),
#  the WebClient might be expecting a full URL with a scheme (like "http://").
  offerServiceHostname: http://localhost
  offerServiceHostPort: 80

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  flyway:
    enabled: false
  jpa:
    # `update` (rather than create-drop) preserves the existing test
    # behaviour around inter-test row state; revisit when Testcontainers
    # MySQL lands (test-modernization).
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    # bootstrap-servers wired by @ServiceConnection on the Testcontainers Kafka.
    consumer:
      auto-offset-reset: earliest

logging:
  level:
    state:
      change:
        logger: ERROR
    kafka:
      cluster: ERROR
      controller:
        KafkaController: ERROR
        RequestSendThread: ERROR
        ZkReplicaStateMachine: ERROR
        TopicDeletionManager: ERROR
      network: ERROR
      zk: ERROR
      coordinator: ERROR
      log: ERROR
      server:
        KafkaConfig: ERROR
        FinalizedFeatureChangeListener: ERROR
        BrokerToControllerRequestThread: ERROR
    org:
      apache:
        zookeeper: ERROR
        kafka:
          server:
            ReplicaAlterLogDirsManager: ERROR
            operationPurgatory$ExpiredOperationReaper: ERROR
            controllerEventManager$ControllerEventThread: ERROR
          common: ERROR
          coordinator: ERROR
          log: ERROR
          clients:
            quota: ERROR
            Metadata: ERROR
            consumer:
              ConsumerConfig: ERROR
              internals: ERROR
