# ==================================================================================================================
# SPRING setup

server:
  port: 5553

spring:
  application:
    name: sky-message

  web:
    locale-resolver: accept_header

  mvc:
    dispatch-options-request: true

  security:
    user:
      name: ${LOCAL_AUTH_USER:user}
      password: ${LOCAL_AUTH_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true

  datasource:
    url: jdbc:mysql://localhost:3306/sky?useSSL=false&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=Europe/Warsaw
    hikari:
      connection-timeout: 60000
      validation-timeout: 60000
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

# expose actuator endpoints (* for all)
management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org:
      springframework:
        web: INFO
      hibernate: INFO
