# ==================================================================================================================
sky:
  apiPrefix: /api/v1
  crossOrigin:
    allowed: ${ACCESS_CONTROL_ALLOW_ORIGIN:https://skycloud.luksarna.com}

# SPRING setup
server:
  port: ${MESSAGE_PORT:5553}
  forward-headers-strategy: framework

springdoc:
  info:
    title: sky-message
    version: v1
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: '/swagger-ui.html'
    urls:
      - url: ${SWAGGER_URL:/v3/api-docs/public}
        name: Booking API doc

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: sky-message
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
  web:
    locale-resolver: accept_header
  mvc:
    dispatch-options-request: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    # validate: schema must match entities; migrations own evolution.
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: ${SHOW_SQL_QUERIES:false}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://host.docker.internal:3306/sky}
    hikari:
      connection-timeout: 60000
      validation-timeout: 60000
      data-source-properties:
        useUnicode: true
        characterEncoding: UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org:
      springframework:
        web: ${SPRING_DEBUG:INFO}
      hibernate: ${HIBERNATE_DEBUG:WARN}
