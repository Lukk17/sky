global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/sky-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: sky-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - sky-booking:5555
          - sky-offer:5552
          - sky-message:5553
          - sky-notify:5554
          - sky-gateway:5777
        labels:
          stack: sky-local
