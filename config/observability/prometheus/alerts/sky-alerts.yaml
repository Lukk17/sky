groups:
  - name: sky-services
    interval: 15s
    rules:
      - alert: SkyServiceDown
        expr: up{job="sky-services"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sky service {{ $labels.instance }} is down"
          description: "Prometheus failed to scrape {{ $labels.instance }} for more than 1 minute."

      - alert: SkyHighErrorRate
        expr: |
          sum by (application) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (application) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx rate on {{ $labels.application }}"
          description: "More than 5% of requests failed with 5xx over the last 5 minutes on {{ $labels.application }}."
