deployment:
  image:
    repository: "sky-message"
    pullPolicy: "Never"
    tag: "latest"

imagePullSecrets: []

oauth2:
  issuerUri: "http://keycloak.127.0.0.1.nip.io/realms/sky"

crossOrigin:
  allowed: "http://localhost:5777,http://localhost:4200"

ingress:
  tls:
    secretName: dev-ssl-cert

  service:
    name: "sky-message-ingress"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
      nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.default.svc.cluster.local:4180/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-response-headers: "x-auth-request-user, x-auth-request-email, x-auth-request-access-token, authorization"
      # Local dev: Angular dev server (http://localhost:4200) calls the API
      # cross-origin with credentials (session cookie + X-XSRF-TOKEN).
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "http://localhost:4200"
      nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization,X-XSRF-TOKEN"
    controller: "nginx"
    hosts:
      - host: "localhost"
        paths:
          - path: "/api/v1/messages"
            pathType: "Prefix"

  swagger:
    name: "sky-message-swagger-ingress"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/swagger-ui$1$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
      nginx.ingress.kubernetes.io/auth-url: ~
      nginx.ingress.kubernetes.io/auth-response-headers: ~
    controller: "nginx"
    hosts:
      - host: "localhost"
        paths:
          - path: "/msg/swagger-ui(/|[.]|$)(.*)"
            pathType: "ImplementationSpecific"

  swaggerResource:
    name: "sky-message-swagger-resources-ingress"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/v3/api-docs/$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
      nginx.ingress.kubernetes.io/auth-url: ~
      nginx.ingress.kubernetes.io/auth-response-headers: ~
    controller: "nginx"
    hosts:
      - host: "localhost"
        paths:
          - path: "/msg/v3/api-docs(/|$)(.*)"
            pathType: "ImplementationSpecific"
