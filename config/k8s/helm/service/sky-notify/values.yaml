# Default values for sky-notify.

name: sky-notify

label:
  app: sky-notify

replicaCount: 1

deployment:
  name: sky-notify-deployment
  image:
    repository: lukk17/sky-notify
    pullPolicy: IfNotPresent
    tag: "v2.0.0"
  container:
    name: sky-notify-container
  env:
    spring:
      debug: "INFO"

imagePullSecrets:
  - name: docker-cred

service:
  name: sky-notify-service
  type: ClusterIP
  port: "5554"

ingress:
  tls:
    secretName: ""

  service:
    name: "sky-notify-ingress"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    controller: "nginx"
    hosts:
      - host: ""
        paths:
          - path: "/notifyWebsocket"
            pathType: "Prefix"

oauth2:
  issuerUri: ""
  audience: "sky-backend"

kafka:
  address: "kafka-service"
  port: "9092"

actuator:
  startupProbe:
    path: "/actuator/health/liveness"
    periodSeconds: 5
    failureThreshold: 36
  livenessProbe:
    path: "/actuator/health/liveness"
    initialDelaySeconds: 0
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    path: "/actuator/health/readiness"
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
