deployment:
  image:
    repository: "sky-booking"
    pullPolicy: "Never"
    tag: "latest"

imagePullSecrets: []

oauth2:
  issuerUri: "http://keycloak.127.0.0.1.nip.io/realms/sky"

crossOrigin:
  allowed: "http://localhost:5777,http://localhost:4200"

ingress:
  tls:
    secretName: dev-ssl-cert

  service:
    name: "sky-booking-ingress"
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
      nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.default.svc.cluster.local:4180/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-response-headers: "x-auth-request-user, x-auth-request-email, x-auth-request-access-token, authorization"
    controller: "nginx"
    hosts:
      - host: "localhost"
        paths:
          - path: "/api/v1/bookings"
            pathType: "Prefix"
          - path: "/api/v1/user/bookings"
            pathType: "Prefix"

  swagger:
    name: "sky-booking-swagger-ingress"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/swagger-ui$1$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
      nginx.ingress.kubernetes.io/auth-url: ~
      nginx.ingress.kubernetes.io/auth-response-headers: ~
    controller: "nginx"
    hosts:
      - host: "localhost"
        paths:
          - path: "/booking/swagger-ui(/|[.]|$)(.*)"
            pathType: "ImplementationSpecific"

  swaggerResource:
    name: "sky-booking-swagger-resources-ingress"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/v3/api-docs/$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "90"
      nginx.ingress.kubernetes.io/auth-url: ~
      nginx.ingress.kubernetes.io/auth-response-headers: ~
    controller: "nginx"
    hosts:
      - host: "localhost"
        paths:
          - path: "/booking/v3/api-docs(/|$)(.*)"
            pathType: "ImplementationSpecific"
