apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- range $key, $value := .Values.label }}
          {{ $key }}: {{ $value | quote }}
      {{- end}}
  template:
    metadata:
      labels:
        {{- range $key, $value := .Values.label }}
          {{ $key }}: {{ $value | quote }}
        {{- end}}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: {{ .Values.deployment.container.name }}
          image: "{{ required "deployment.image.repository must be set, see values.yaml" .Values.deployment.image.repository }}:{{ required "deployment.image.tag must be set, see values.yaml" .Values.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: {{ .Values.actuator.startupProbe.path }}
              port: {{ .Values.service.port }}
            periodSeconds: {{ .Values.actuator.startupProbe.periodSeconds }}
            failureThreshold: {{ .Values.actuator.startupProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.actuator.livenessProbe.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.actuator.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.actuator.livenessProbe.periodSeconds }}
            failureThreshold: {{ .Values.actuator.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.actuator.readinessProbe.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.actuator.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.actuator.readinessProbe.periodSeconds }}
            failureThreshold: {{ .Values.actuator.readinessProbe.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: BOOKING_PORT
              value: "{{ .Values.service.port }}"
            - name: OFFER_SERVICE_HOSTNAME
              value: "{{ tpl .Values.offerService.hostname . }}"
            - name: OFFER_SERVICE_HOST_PORT
              value: "{{ .Values.offerService.port }}"
            - name: KAFKA_ADDRESS
              value: {{ .Values.kafka.address }}
            - name: KAFKA_PORT
              value: "{{ .Values.kafka.port }}"
            - name: SPRING_DATASOURCE_URL
              value: "{{ .Values.deployment.env.spring.datasourceUrl }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.deployment.env.postgres.user }}
                  name: "{{ .Values.secret.name }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.deployment.env.postgres.pass }}
                  name: "{{ .Values.secret.name }}"
            - name: SPRING_DEBUG
              value: "{{ .Values.deployment.env.spring.debug }}"
            - name: HIBERNATE_DEBUG
              value: "{{ .Values.deployment.env.hibernate.debug }}"
            - name: SHOW_SQL_QUERIES
              value: "{{ .Values.deployment.env.hibernate.showSqlQueries }}"
            - name: OAUTH2_ISSUER_URI
              value: "{{ required "oauth2.issuerUri must be set by a values-<env>.yaml overlay" .Values.oauth2.issuerUri }}"
            - name: OAUTH2_AUDIENCE
              value: "{{ .Values.oauth2.audience }}"
            - name: ACCESS_CONTROL_ALLOW_ORIGIN
              value: "{{ required "crossOrigin.allowed must be set by a values-<env>.yaml overlay" .Values.crossOrigin.allowed }}"
