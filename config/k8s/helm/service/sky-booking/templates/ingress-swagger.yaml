
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.ingress.swagger.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
  {{- range $key, $value := .Values.ingress.swagger.annotations }}
{{- if $value }}
    {{ $key }}: {{ $value | quote }}
  {{- end}}
  {{- end}}
spec:
  ingressClassName: {{ .Values.ingress.swagger.controller }}

  tls:
    - hosts:
        {{- range .Values.ingress.swagger.hosts }}
        - {{ required "ingress hosts[].host must be set by a values-<env>.yaml overlay" .host | quote }}
        {{- end }}
      secretName: {{ required "ingress.tls.secretName must be set by a values-<env>.yaml overlay" .Values.ingress.tls.secretName }}

  rules:
    {{- range .Values.ingress.swagger.hosts }}
    - host: {{ required "ingress hosts[].host must be set by a values-<env>.yaml overlay" .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $.Values.service.name }}
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
