---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    k8s-app: oauth2-proxy
  name: oauth2-proxy
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: oauth2-proxy
  template:
    metadata:
      labels:
        k8s-app: oauth2-proxy
    spec:
      containers:
        - args:
            - --provider={{ .Values.args.provider }}
            - --email-domain={{ .Values.args.emailDomain }}
            - --upstream={{ .Values.args.upstream }}
            - --http-address={{ .Values.args.httpAddress }}
            - --cookie-secure={{ .Values.args.cookieSecure }}
            - --cookie-samesite={{ .Values.args.cookieSamesite }}
            - --oidc-issuer-url={{ required "args.oidcIssuerUrl must be set by a values-<env>.yaml overlay" .Values.args.oidcIssuerUrl }}
            - --insecure-oidc-allow-unverified-email={{ .Values.args.insecureOidcAllowUnverifiedEmail }}
            - --redirect-url={{ required "args.redirectUrl must be set by a values-<env>.yaml overlay" .Values.args.redirectUrl }}
            - --scope={{ .Values.args.scope }}
            - --set-xauthrequest={{ .Values.args.setXauthrequest }}
            - --pass-authorization-header={{ .Values.args.passAuthorizationHeader }}
            - --set-authorization-header={{ .Values.args.setAuthorizationHeader }}
            - --pass-access-token={{ .Values.args.passAccessToken }}
            - --pass-host-header={{ .Values.args.passHostHeader }}
            - --pass-user-headers={{ .Values.args.passUserHeaders }}
            - --pass-basic-auth={{ .Values.args.passBasicAuth }}
            - --cookie-csrf-per-request=true
            - --cookie-csrf-expire=15m
            # Bearer passthrough (edge-session-parity 2.6): callers presenting a
            # valid Keycloak JWT in Authorization bypass the cookie session on the
            # /oauth2/auth probe (validated against oidc-issuer-url JWKS) and the
            # header continues upstream verbatim via set/pass-authorization-header,
            # where services validate it themselves as today.
            - --skip-jwt-bearer-tokens=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secrets.clientIdKey }}
                  name: {{ .Values.secrets.secretName }}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secrets.clientSecretKey }}
                  name: {{ .Values.secrets.secretName }}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secrets.cookieSecretKey }}
                  name: {{ .Values.secrets.secretName }}

          image: {{ .Values.image.name }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          name: oauth2-proxy
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
        # Session responder sidecar: answers GET /api/session as {email, csrfToken}
        # behind the session ingress auth-url gate. Email comes from the
        # auth-request headers oauth2-proxy sets (X-Auth-Request-Email/User);
        # csrfToken is the per-session oauth2-proxy CSRF cookie value echoed back
        # for the frontend in-memory store (X-XSRF-TOKEN on mutations).
        - name: session-responder
          image: "python:3.12-alpine"
          command: ["python3", "/srv/server.py"]
          volumeMounts:
            - name: session-responder
              mountPath: /srv
          ports:
            - containerPort: {{ .Values.session.port }}
              protocol: TCP
      volumes:
        - name: session-responder
          configMap:
            name: session-responder
