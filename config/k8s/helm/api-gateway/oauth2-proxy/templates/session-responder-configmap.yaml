---
apiVersion: v1
kind: ConfigMap
metadata:
  name: session-responder
  namespace: {{ .Release.Namespace }}
data:
  server.py: |
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            email = (self.headers.get("X-Auth-Request-Email")
                     or self.headers.get("X-Auth-Request-User") or "")
            csrf = ""
            for part in (self.headers.get("Cookie") or "").replace(";", " ").split():
                if "_oauth2_proxy_csrf" in part and "=" in part:
                    csrf = part.split("=", 1)[1].strip().strip(";")
                    break
            body = json.dumps({
                "email": email,
                "csrfToken": csrf,
                "logoutUrl": os.environ.get("SKY_LOGOUT_URL", ""),
            }).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", {{ .Values.session.port }}), H).serve_forever()
