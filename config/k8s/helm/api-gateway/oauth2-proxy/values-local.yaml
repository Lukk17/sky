# Local-environment overlay for oauth2-proxy.
#
# No client secret lives in this file. The OIDC client secret is sourced per
# deploy from the `sky-secrets` Secret entry `keycloak-client-secret`
# (your gitignored sky-secrets-local.yaml, see config/keycloak/SETUP.md
# "Sourcing the client secret at deploy time"); the deployment template reads
# it via .Values.secrets. Keep it that way.
#
# Apply on top of values.yaml:
#   helm upgrade --install oauth2-proxy ./config/k8s/helm/api-gateway/oauth2-proxy -f ./config/k8s/helm/api-gateway/oauth2-proxy/values-local.yaml

args:
  cookieSecure: "false"
  # Lax so the CSRF cookie set at /oauth2/start is sent back on the cross-site
  # Keycloak -> /oauth2/callback navigation (Strict withholds it -> 403
  # "unable to obtain CSRF cookie").
  cookieSamesite: "lax"
  oidcIssuerUrl: "http://keycloak.127.0.0.1.nip.io/realms/sky"
  redirectUrl: "http://localhost:5777/oauth2/callback"
  # Request the roles scope so ID/access tokens carry realm_access.roles
  # (client-level mapper in sky-realm.json emits it); the portless default
  # scope in values.yaml would otherwise leave it to default-scope luck.
  scope: "openid email roles"
  # Browser-facing login URL override: discovery/issuer stay portless (in-cluster
  # port 80 + token iss validation), but the browser is sent to :5777 so the
  # Keycloak login page renders instead of connection-refused on port 80.
  # NOTE: keycloak-oidc discovery overwrites login-url, so discovery is skipped
  # and every server-side endpoint is pinned portless explicitly.
  skipOidcDiscovery: "true"
  loginUrl: "http://keycloak.127.0.0.1.nip.io:5777/realms/sky/protocol/openid-connect/auth"
  redeemUrl: "http://keycloak.127.0.0.1.nip.io/realms/sky/protocol/openid-connect/token"
  oidcJwksUrl: "http://keycloak.127.0.0.1.nip.io/realms/sky/protocol/openid-connect/certs"
  profileUrl: "http://keycloak.127.0.0.1.nip.io/realms/sky/protocol/openid-connect/userinfo"
  # Allow rd (post-login return) to the local frontend origin on :4200, plus
  # the browser-reachable Keycloak host: logout navigates the full browser to
  # /logout?rd=<keycloak end-session with id_token_hint={id_token}> and
  # oauth2-proxy substitutes the server-side ID token before redirecting, so
  # Keycloak ends the SSO session at once with no confirm page. Without this
  # entry the rd is dropped and only the proxy cookie dies (silent re-login).
  whitelistDomain: "localhost:4200,keycloak.127.0.0.1.nip.io:5777,keycloak.127.0.0.1.nip.io"

session:
  corsOrigin: "http://localhost:4200"
  # Browser-reachable Keycloak end-session endpoint (port 5777 serves the login
  # page, like loginUrl above); post-logout returns to the dev-server origin.
  # The post_logout_redirect_uri host must be allowlisted in the sky-backend
  # client attributes (post.logout.redirect.uris in sky-realm.json).
  logoutUrl: "http://keycloak.127.0.0.1.nip.io:5777/realms/sky/protocol/openid-connect/logout?post_logout_redirect_uri=http://localhost:4200/home&client_id=sky-backend"

ingress:
  tls:
    secretName: dev-ssl-cert
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  hosts:
    - host: localhost
      paths:
        - path: "/oauth2(/|$)(.*)"
          pathType: ImplementationSpecific
