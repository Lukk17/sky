---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    component: minio
spec:
  replicas: 1
  serviceName: minio-service
  selector:
    matchLabels:
      component: minio
  template:
    metadata:
      labels:
        component: minio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: minio-storage
          persistentVolumeClaim:
            claimName: {{ .Values.volume.claimName }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: minio
          image: {{ .Values.image.name }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          args:
            - server
            - /data
            - --console-address
            - ":{{ .Values.service.consolePort }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: api
              containerPort: {{ .Values.service.port }}
            - name: console
              containerPort: {{ .Values.service.consolePort }}
          volumeMounts:
            - name: minio-storage
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.service.port }}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: {{ .Values.service.port }}
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: {{ .Values.service.port }}
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secret.rootUserKey }}
                  name: {{ .Values.secret.name }}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secret.rootPasswordKey }}
                  name: {{ .Values.secret.name }}
