image:
  name: "quay.io/keycloak/keycloak:26.2.5"
  imagePullPolicy: "IfNotPresent"

hostname: "keycloak.luksarna.com"

secret:
  name: "sky-secrets"
  adminUserKey: "keycloak-admin"
  adminPasswordKey: "keycloak-admin-password"
  dbUserKey: "keycloak-db-user"
  dbPasswordKey: "keycloak-db-password"
  clientSecretKey: "keycloak-client-secret"

service:
  port: 8080
  managementPort: 9000

ingress:
  tls:
    secretName: dev-ssl-cert
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  controller: "nginx"
  hosts:
    - host: "keycloak.luksarna.com"
      paths:
        - path: "/"
          pathType: "Prefix"

postgres:
  image: "postgres:16-alpine"
  imagePullPolicy: "IfNotPresent"
  service:
    port: 5432
  volume:
    claimName: "keycloak-postgres-pvc"
    storage: "2Gi"
  dbName: "keycloak"
  secret:
    userKey: "keycloak-db-user"
    passwordKey: "keycloak-db-password"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi
