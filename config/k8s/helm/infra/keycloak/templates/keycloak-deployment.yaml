---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-deployment
  namespace: {{ .Release.Namespace }}
  labels:
    component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      component: keycloak
  template:
    metadata:
      labels:
        component: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-config
        - name: tmp
          emptyDir: {}
      containers:
        - name: keycloak
          image: {{ .Values.image.name }}
          imagePullPolicy: {{ .Values.image.imagePullPolicy }}
          args:
            - start
            - --import-realm
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            - name: management
              containerPort: {{ .Values.service.managementPort }}
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/started
              port: {{ .Values.service.managementPort }}
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ .Values.service.managementPort }}
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ .Values.service.managementPort }}
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secret.adminUserKey }}
                  name: {{ .Values.secret.name }}
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secret.adminPasswordKey }}
                  name: {{ .Values.secret.name }}
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-postgres-service:{{ .Values.postgres.service.port }}/{{ .Values.postgres.dbName }}"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secret.dbUserKey }}
                  name: {{ .Values.secret.name }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.secret.dbPasswordKey }}
                  name: {{ .Values.secret.name }}
            - name: KC_HOSTNAME
              value: {{ .Values.hostname }}
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
