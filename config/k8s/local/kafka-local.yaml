---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: default
data:
  server.properties: |
    node.id=1
    process.roles=broker,controller
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://kafka-service:9092
    controller.quorum.voters=1@localhost:9093
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/tmp/kafka-logs
    auto.create.topics.enable=true
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    num.partitions=1
    default.replication.factor=1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-service
  namespace: default
  labels:
    component: kafka
spec:
  serviceName: kafka-service-headless
  replicas: 1
  selector:
    matchLabels:
      component: kafka
  template:
    metadata:
      labels:
        component: kafka
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: format-storage
          image: apache/kafka:3.7.1
          command:
            - /bin/bash
            - -c
            - |
              if [ ! -f /tmp/kafka-logs/meta.properties ]; then
                /opt/kafka/bin/kafka-storage.sh format \
                  --config /kafka-config/server.properties \
                  --cluster-id MkU3OEVBNTcwNTJENDM2Qg \
                  --ignore-formatted
              fi
          volumeMounts:
            - name: kafka-config
              mountPath: /kafka-config
            - name: kafka-logs
              mountPath: /tmp/kafka-logs
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          command:
            - /opt/kafka/bin/kafka-server-start.sh
            - /kafka-config/server.properties
          ports:
            - containerPort: 9092
              name: client
            - containerPort: 9093
              name: controller
          volumeMounts:
            - name: kafka-config
              mountPath: /kafka-config
            - name: kafka-logs
              mountPath: /tmp/kafka-logs
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: kafka-config
          configMap:
            name: kafka-config
        - name: kafka-logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: default
  labels:
    component: kafka
spec:
  type: ClusterIP
  ports:
    - port: 9092
      targetPort: 9092
      name: client
  selector:
    component: kafka
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service-headless
  namespace: default
spec:
  clusterIP: None
  ports:
    - port: 9092
      name: client
    - port: 9093
      name: controller
  selector:
    component: kafka
