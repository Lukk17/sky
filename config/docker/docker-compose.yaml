name: sky

# Postgres, Keycloak, and the S3 object store are provided externally (local-dev stack / host install).
# Only Kafka and the application services are managed here.
# Default datasource host: host.docker.internal:5432 (host Postgres reachable from container).
# Default object-store host: s3.localhost:9070. The host resolver maps every name under .localhost to
# 127.0.0.1 and the extra_hosts entry below maps the same name to the host gateway, so a path-style
# presigned URL signed inside the network is fetchable from the host with its Host header and signature untouched.
# Presigned URLs use localhost:9070 so host clients resolve them.

x-sky-common: &sky-common
  networks:
    - sky-network
  extra_hosts:
    - "keycloak.test:host-gateway"
    - "host.docker.internal:host-gateway"
  environment:
    SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/sky}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
    OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:5777/auth/realms/sky}
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/certs}
    SPRING_PROFILES_ACTIVE: default
    SPRING_DEBUG: INFO

x-sky-health: &sky-health
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 60s

services:

  postgres:
    image: postgres:16-alpine
    container_name: sky-postgres
    networks:
      - sky-network
    environment:
      POSTGRES_DB: sky
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sky"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.7
    container_name: sky-keycloak
    networks:
      - sky-network
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: local
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:5777/auth
      KC_HOSTNAME_ADMIN: http://localhost:5777/auth
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_DEBUG: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
    command: ["start", "--import-realm", "--http-enabled=true"]
    volumes:
      - ../k8s/helm/infra/keycloak/files:/opt/keycloak/data/import:ro
    healthcheck:
      # Plain HTTP on 8080 now: no TLS in compose, Keycloak sits behind the gateway.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  floci:
    image: floci/floci:2.0.1
    container_name: sky-floci
    networks:
      - sky-network
    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_SERVICES_UI_ENABLED: "false"
    extra_hosts:
      - "s3.localhost:host-gateway"
    volumes:
      - floci_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_floci/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sky-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - sky-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  sky-booking:
    container_name: sky-booking
    build:
      dockerfile: sky-booking/docker/Dockerfile
      context: ../../
      tags:
        - "sky-booking:${SKY_VERSION:-2.0.0}"
    image: sky-booking:latest
    networks:
      - sky-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.test:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/sky}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
      KAFKA_ADDRESS: kafka
      KAFKA_PORT: "9092"
      OFFER_SERVICE_HOSTNAME: http://sky-offer
      OFFER_SERVICE_HOST_PORT: "5552"
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:5777/auth/realms/sky}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/certs}
      SPRING_PROFILES_ACTIVE: default
      SHOW_SQL_QUERIES: "false"
      SPRING_DEBUG: INFO
      HIBERNATE_DEBUG: WARN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5555/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  sky-offer:
    container_name: sky-offer
    build:
      dockerfile: sky-offer/docker/Dockerfile
      context: ../../
      tags:
        - "sky-offer:${SKY_VERSION:-2.0.0}"
    image: sky-offer:latest
    networks:
      - sky-network
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      floci:
        condition: service_healthy
    extra_hosts:
      - "keycloak.test:host-gateway"
      - "host.docker.internal:host-gateway"
      - "s3.localhost:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/sky}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
      KAFKA_ADDRESS: kafka
      KAFKA_PORT: "9092"
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:5777/auth/realms/sky}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/certs}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://floci:4566}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:5777/s3}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-root}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-localdev}
      SPRING_PROFILES_ACTIVE: default
      SHOW_SQL_QUERIES: "false"
      SPRING_DEBUG: INFO
      HIBERNATE_DEBUG: WARN
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5552/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  sky-message:
    <<: *sky-common
    container_name: sky-message
    build:
      dockerfile: sky-message/docker/Dockerfile
      context: ../../
      tags:
        - "sky-message:${SKY_VERSION:-2.0.0}"
    image: sky-message:latest
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/sky}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local}
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:5777/auth/realms/sky}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/certs}
      SPRING_PROFILES_ACTIVE: default
      SHOW_SQL_QUERIES: "false"
      SPRING_DEBUG: INFO
      HIBERNATE_DEBUG: WARN
    healthcheck:
      <<: *sky-health
      test: ["CMD-SHELL", "wget -qO- http://localhost:5553/actuator/health/readiness || exit 1"]

  sky-notify:
    container_name: sky-notify
    build:
      dockerfile: sky-notify/docker/Dockerfile
      context: ../../
      tags:
        - "sky-notify:${SKY_VERSION:-2.0.0}"
    image: sky-notify:latest
    networks:
      - sky-network
    depends_on:
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    extra_hosts:
      - "keycloak.test:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_ADDRESS: kafka
      KAFKA_PORT: "9092"
      OAUTH2_ISSUER_URI: ${OAUTH2_ISSUER_URI:-http://localhost:5777/auth/realms/sky}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: ${OAUTH2_JWK_SET_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/certs}
      SPRING_PROFILES_ACTIVE: default
      SPRING_DEBUG: INFO
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5554/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  sky-gateway:
    container_name: sky-gateway
    build:
      dockerfile: sky-gateway/docker/Dockerfile
      context: ../../
      tags:
        - "sky-gateway:${SKY_VERSION:-2.0.0}"
    image: sky-gateway:latest
    networks:
      - sky-network
    ports:
      - "5777:5777"
    depends_on:
      sky-booking:
        condition: service_healthy
      sky-offer:
        condition: service_healthy
      sky-message:
        condition: service_healthy
      sky-notify:
        condition: service_healthy
    extra_hosts:
      - "keycloak.test:host-gateway"
      - "host.docker.internal:host-gateway"
    environment:
      BOOKING_URI: http://sky-booking:5555
      OFFER_URI: http://sky-offer:5552
      MESSAGE_URI: http://sky-message:5553
      NOTIFY_URI: http://sky-notify:5554
      SPRING_PROFILES_ACTIVE: default
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:5777/auth/realms/sky}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/certs}
      KEYCLOAK_AUTH_URI: ${KEYCLOAK_AUTH_URI:-http://localhost:5777/auth/realms/sky/protocol/openid-connect/auth}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/token}
      KEYCLOAK_USER_INFO_URI: ${KEYCLOAK_USER_INFO_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/userinfo}
      KEYCLOAK_END_SESSION_URI: ${KEYCLOAK_END_SESSION_URI:-http://keycloak:8080/auth/realms/sky/protocol/openid-connect/logout}
      KEYCLOAK_URI: http://keycloak:8080
      S3_URI: http://floci:4566
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-sky-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-only-change-in-prod}
      SPRING_DEBUG: INFO
      GATEWAY_DEBUG: INFO
    healthcheck:
      # 127.0.0.1, not localhost: this image sets -Djava.net.preferIPv4Stack=true
      # (see sky-gateway/docker/Dockerfile), so Netty binds IPv4 only while musl
      # resolves localhost to ::1 first and wget then gets connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5777/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  sky-view:
    container_name: sky-view
    build:
      dockerfile: apps/frontend/sky-view/Dockerfile
      context: ../../
      tags:
        - "sky-view:${SKY_VERSION:-2.0.0}"
    image: sky-view:latest
    networks:
      - sky-network
    ports:
      - "4200:80"
    depends_on:
      sky-gateway:
        condition: service_healthy
    environment:
      API_BASE_URL: ${FRONTEND_API_BASE_URL:-http://localhost:5777}
      NOTIFY_SOCKET_PATH: /notifyWebsocket
    healthcheck:
      # 127.0.0.1, not localhost: `listen 80` binds IPv4 while musl resolves
      # localhost to ::1 first, so wget gets connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/assets/config/app-config.json || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  seed:
    image: node:22-alpine
    container_name: sky-seed
    networks:
      - sky-network
    depends_on:
      sky-gateway:
        condition: service_healthy
      sky-view:
        condition: service_healthy
    volumes:
      - ../../seed:/workspace/seed:ro
    working_dir: /workspace/seed
    environment:
      EDGE_BASE: http://sky-gateway:5777
      KEYCLOAK_BASE: http://keycloak:8080/auth
      TLS_INSECURE: "0"
    command: ["sh", "-c", "node seed.mjs || true"]

volumes:
  kafka_data:
  postgres_data:
  floci_data:

networks:
  sky-network:
    name: sky-network
