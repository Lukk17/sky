name: E2E (Postman / Newman)

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  newman:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}

      - name: Build service images
        run: |
          set -euo pipefail
          for svc in sky-booking sky-offer sky-message sky-notify; do
            docker build -f "${svc}/docker/Dockerfile" -t "${svc}:e2e" .
          done

      - name: Bring up the stack
        run: |
          # The local-dev docker-compose covers MySQL + Kafka + Zookeeper +
          # the four services. Adjust the path if the compose file moves.
          if [ -f config/docker/docker-compose.yml ]; then
            docker compose -f config/docker/docker-compose.yml up -d
          else
            echo "::error::Expected config/docker/docker-compose.yml — required for E2E"
            exit 1
          fi

      - name: Wait for services to be healthy
        run: |
          set -euo pipefail
          for port in 5552 5553 5554 5555; do
            for attempt in $(seq 1 60); do
              if curl -fsS "http://localhost:${port}/actuator/health/readiness" >/dev/null 2>&1; then
                echo "service on port ${port} ready"
                break
              fi
              if [ "${attempt}" -eq 60 ]; then
                echo "::error::service on port ${port} did not become ready in 5 minutes"
                docker compose -f config/docker/docker-compose.yml logs
                exit 1
              fi
              sleep 5
            done
          done

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman collection
        run: |
          newman run config/postman-collection/sky.postman_collection.json \
            -e config/postman-collection/localhost.postman_environment.json \
            --reporters cli,junit \
            --reporter-junit-export newman-results.xml

      - name: Upload Newman results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-results
          path: newman-results.xml

      - name: Tear down
        if: always()
        run: docker compose -f config/docker/docker-compose.yml down -v
