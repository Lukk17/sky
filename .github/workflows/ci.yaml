name: CI (build & test)

# Runs once when a PR is opened/reopened (not on every pushed commit), and on demand.
on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            sky-common/build/reports/tests/
            sky-common/build/test-results/
            sky-booking/build/reports/tests/
            sky-booking/build/test-results/
            sky-offer/build/reports/tests/
            sky-offer/build/test-results/
            sky-message/build/reports/tests/
            sky-message/build/test-results/
            sky-notify/build/reports/tests/
            sky-notify/build/test-results/
            sky-gateway/build/reports/tests/
            sky-gateway/build/test-results/
