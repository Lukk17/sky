name: Release

# Selective per-service release, multi-arch build once, dual-registry push.
#
# Each service's CHANGELOG.md is the source of truth for its release version:
# the workflow reads the topmost `## [x.y.z]` entry and never writes to any
# file. The `version` in `build.gradle.kts` is a cosmetic per-module label the
# release workflow does not read. Developers bump the changelog in PRs
# (enforced by ci.yaml's verify-changelog job). The workflow only reads it.
#
# A release is initiated from Actions -> Release -> Run workflow. Tick exactly
# the services to ship. Unticked services are not built and their images are
# untouched. The workflow produces zero commits. The only refs created are the
# git tag and the GitHub Release.
#
# Three jobs, in order:
#   prepare       validates inputs, checks the stack tag, reads each selected
#                 service's version from its CHANGELOG.md into a matrix
#   build-and-push for each selected service, runs the per-registry bump guard,
#                 builds a multi-arch image once, pushes v<version> plus latest
#                 to Docker Hub and GHCR
#   release       skipped when create_github_release is unticked. Otherwise
#                 composes a body listing every service and cuts the tag
#                 sky_<stack_version> plus a GitHub Release.
#
# Nothing in this file hardcodes a service version. Service versions come only
# from the changelogs at run time. The stack_version input names the monorepo
# tag and is not a service version.
on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Cut the git tag and GitHub Release. Untick to publish images only, consuming no stack version.'
        required: true
        type: boolean
        default: true
      stack_version:
        description: 'Stack version (e.g. 1.1.1). The monorepo release tag will be sky_<stack_version>. Ignored when create_github_release is unticked.'
        required: false
        default: ''
        type: string
      release_sky_booking:
        description: 'Release sky-booking (apps/backend/sky-booking/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_sky_offer:
        description: 'Release sky-offer (apps/backend/sky-offer/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_sky_message:
        description: 'Release sky-message (apps/backend/sky-message/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_sky_notify:
        description: 'Release sky-notify (apps/backend/sky-notify/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_sky_gateway:
        description: 'Release sky-gateway (apps/backend/sky-gateway/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.stack_version || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and build release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Validate inputs and build release matrix
        id: emit
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          CREATE_RELEASE: ${{ inputs.create_github_release }}
          SEL_SKY_BOOKING: ${{ inputs.release_sky_booking }}
          SEL_SKY_OFFER: ${{ inputs.release_sky_offer }}
          SEL_SKY_MESSAGE: ${{ inputs.release_sky_message }}
          SEL_SKY_NOTIFY: ${{ inputs.release_sky_notify }}
          SEL_SKY_GATEWAY: ${{ inputs.release_sky_gateway }}
        run: |
          set -euo pipefail

          # 1. Fail if zero services selected.
          SELECTED_COUNT=0
          for VAR in "$SEL_SKY_BOOKING" "$SEL_SKY_OFFER" "$SEL_SKY_MESSAGE" "$SEL_SKY_NOTIFY" "$SEL_SKY_GATEWAY"; do
            [ "$VAR" = "true" ] && SELECTED_COUNT=$((SELECTED_COUNT + 1))
          done
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            echo "::error::No services selected for release. Tick at least one service boolean before dispatching."
            exit 1
          fi

          # 2. Stack-version checks, only when a release is being cut.
          if [ "$CREATE_RELEASE" = "true" ]; then
            if [ -z "$STACK_VERSION" ]; then
              echo "::error::stack_version is required when create_github_release is ticked."
              exit 1
            fi

            if [[ ! "$STACK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::stack_version '${STACK_VERSION}' is not MAJOR.MINOR.PATCH with an optional -prerelease suffix."
              exit 1
            fi

            TAG="sky_${STACK_VERSION}"

            if git tag -l "$TAG" | grep -q "^${TAG}$"; then
              echo "::error::Tag '${TAG}' already exists. Stack versions are cut once. Use a different stack_version."
              exit 1
            fi
          else
            echo "::notice::create_github_release is unticked. Images will be published with no git tag and no GitHub Release, and no stack version is consumed."
          fi

          # 3. Read current versions from each service's CHANGELOG.md.
          #
          # Every service's CHANGELOG.md carries its version in the topmost
          # entry, shape `## [0.0.1]` optionally followed by ` - <date>`. The
          # changelog is the source of truth the release workflow reads. The
          # `version` in build.gradle.kts is a cosmetic per-module label the
          # release workflow never reads, and the two are allowed to disagree
          # with no pipeline consequence. The actual "was this bumped" guard
          # runs later, per service, against the registries themselves (see
          # build-and-push) rather than against git history, so it cannot break
          # when a module's path moves.

          read_changelog_version() {
            local changelog="$1"
            grep -oP -m1 '##\s*\[\K[0-9]+\.[0-9]+\.[0-9]+' "$changelog"
          }

          MATRIX_INCLUDE="[]"

          add_to_matrix() {
            local service="$1" path="$2" version="$3" image_name="$4" dockerfile="$5"
            MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | python3 -c "import sys,json; a=json.load(sys.stdin); a.append({'service':'${service}','path':'${path}','version':'${version}','image_name':'${image_name}','dockerfile':'${dockerfile}'}); print(json.dumps(a))")
          }

          check_and_add() {
            local selected="$1" service="$2" path="$3" changelog="$4" dockerfile="$5"

            if [ "$selected" != "true" ]; then
              return
            fi

            CUR_VERSION=$(read_changelog_version "$changelog") || true
            if [ -z "$CUR_VERSION" ]; then
              echo "::error::Could not read a '## [x.y.z]' version entry from ${changelog} for service ${service}."
              exit 1
            fi

            local image_name="${service}"
            echo "${service}: ${CUR_VERSION}"
            add_to_matrix "$service" "$path" "$CUR_VERSION" "$image_name" "$dockerfile"
          }

          check_and_add "$SEL_SKY_BOOKING" "sky-booking" "apps/backend" "apps/backend/sky-booking/CHANGELOG.md" "apps/backend/sky-booking/docker/Dockerfile"
          check_and_add "$SEL_SKY_OFFER" "sky-offer" "apps/backend" "apps/backend/sky-offer/CHANGELOG.md" "apps/backend/sky-offer/docker/Dockerfile"
          check_and_add "$SEL_SKY_MESSAGE" "sky-message" "apps/backend" "apps/backend/sky-message/CHANGELOG.md" "apps/backend/sky-message/docker/Dockerfile"
          check_and_add "$SEL_SKY_NOTIFY" "sky-notify" "apps/backend" "apps/backend/sky-notify/CHANGELOG.md" "apps/backend/sky-notify/docker/Dockerfile"
          check_and_add "$SEL_SKY_GATEWAY" "sky-gateway" "apps/backend" "apps/backend/sky-gateway/CHANGELOG.md" "apps/backend/sky-gateway/docker/Dockerfile"

          MATRIX="{\"include\":${MATRIX_INCLUDE}}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push ${{ matrix.service }} v${{ matrix.version }}
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard against re-publishing an already-released version
        run: |
          set -euo pipefail

          SERVICE="${{ matrix.service }}"
          VERSION="${{ matrix.version }}"
          IMAGE_NAME="${{ matrix.image_name }}"
          DOCKERHUB_IMAGE="lukk17/${IMAGE_NAME}"
          GHCR_IMAGE="ghcr.io/lukk17/${IMAGE_NAME}"

          # Checked against both registries this stack publishes to. A tag
          # present on both is a completed prior release of this exact
          # version - fail and ask for a new CHANGELOG.md entry. Present on
          # neither is the normal case - proceed. Present on exactly one is
          # treated as an incomplete prior publish (for example Docker Hub
          # succeeded and GHCR failed on a transient auth/network error) and
          # is completed rather than blocked, since the code a bumped
          # CHANGELOG.md entry would gate is unchanged either way - the
          # pull-request changelog check already refuses to merge module
          # changes without a version bump, so nothing here re-ships altered
          # content under an old version number.
          check_tag() {
            local image="$1"
            local output status
            set +e
            output=$(docker manifest inspect "${image}:v${VERSION}" 2>&1)
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              printf 'found\n'
              return 0
            fi

            if printf '%s' "${output}" | grep -qiE 'no such manifest|manifest unknown|not found'; then
              printf 'absent\n'
              return 0
            fi

            printf '::error::Could not determine whether %s:v%s exists (auth/network error). Failing closed without pushing.\n%s\n' "${image}" "${VERSION}" "${output}" >&2
            return 1
          }

          DOCKERHUB_STATE=$(check_tag "${DOCKERHUB_IMAGE}")
          GHCR_STATE=$(check_tag "${GHCR_IMAGE}")

          if [ "${DOCKERHUB_STATE}" = "found" ] && [ "${GHCR_STATE}" = "found" ]; then
            echo "::error::${SERVICE} v${VERSION} already exists on both registries. Add a new CHANGELOG.md entry before releasing."
            exit 1
          fi

          if [ "${DOCKERHUB_STATE}" = "found" ] || [ "${GHCR_STATE}" = "found" ]; then
            echo "::warning::${SERVICE} v${VERSION} already exists on one registry only (dockerhub=${DOCKERHUB_STATE}, ghcr=${GHCR_STATE}). Treating this as an incomplete previous publish and completing it on both registries."
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lukk17/${{ matrix.image_name }}:v${{ matrix.version }}
            lukk17/${{ matrix.image_name }}:latest
            ghcr.io/lukk17/${{ matrix.image_name }}:v${{ matrix.version }}
            ghcr.io/lukk17/${{ matrix.image_name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    name: Create GitHub Release sky_${{ inputs.stack_version }}
    needs: build-and-push
    if: ${{ inputs.create_github_release }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Read all service versions and compose release body
        id: body
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          SEL_SKY_BOOKING: ${{ inputs.release_sky_booking }}
          SEL_SKY_OFFER: ${{ inputs.release_sky_offer }}
          SEL_SKY_MESSAGE: ${{ inputs.release_sky_message }}
          SEL_SKY_NOTIFY: ${{ inputs.release_sky_notify }}
          SEL_SKY_GATEWAY: ${{ inputs.release_sky_gateway }}
        run: |
          set -euo pipefail

          read_changelog_version() {
            grep -oP -m1 '##\s*\[\K[0-9]+\.[0-9]+\.[0-9]+' "$1"
          }

          V_SKY_BOOKING=$(read_changelog_version "apps/backend/sky-booking/CHANGELOG.md")
          V_SKY_OFFER=$(read_changelog_version "apps/backend/sky-offer/CHANGELOG.md")
          V_SKY_MESSAGE=$(read_changelog_version "apps/backend/sky-message/CHANGELOG.md")
          V_SKY_NOTIFY=$(read_changelog_version "apps/backend/sky-notify/CHANGELOG.md")
          V_SKY_GATEWAY=$(read_changelog_version "apps/backend/sky-gateway/CHANGELOG.md")

          label() {
            local flag="$1"
            [ "$flag" = "true" ] && echo " (released)" || echo ""
          }

          # Compose release body using printf into a file (heredoc terminators
          # at column 0 are invalid inside a YAML block scalar)
          {
            printf "## sky_%s\n\n" "${STACK_VERSION}"
            printf "### Service versions\n\n"
            printf "| Service | Version | |\n"
            printf "|---|---|---|\n"
            printf "| sky-booking | %s |%s |\n" "${V_SKY_BOOKING}" "$(label "$SEL_SKY_BOOKING")"
            printf "| sky-offer | %s |%s |\n" "${V_SKY_OFFER}" "$(label "$SEL_SKY_OFFER")"
            printf "| sky-message | %s |%s |\n" "${V_SKY_MESSAGE}" "$(label "$SEL_SKY_MESSAGE")"
            printf "| sky-notify | %s |%s |\n" "${V_SKY_NOTIFY}" "$(label "$SEL_SKY_NOTIFY")"
            printf "| sky-gateway | %s |%s |\n" "${V_SKY_GATEWAY}" "$(label "$SEL_SKY_GATEWAY")"
            printf "\nServices marked **(released)** had their images built and pushed in this run. All others carry their previous image.\n"
            printf "\n---\n"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sky_${{ inputs.stack_version }}
          name: sky_${{ inputs.stack_version }}
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
