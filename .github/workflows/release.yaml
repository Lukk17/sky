name: Release (manual)

# Manual-only release. Provide the version (e.g. 1.0.3, no leading "v").
# Step 1 builds and pushes the Docker images. A manual approval gate (the
# "release" GitHub Environment) then guards Step 2, which cuts the GitHub release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, without the leading v (e.g. 1.0.3)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Fail fast before building anything if this version is already released.
      - name: Fail if version already released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists on GitHub. Choose a new version."
            exit 1
          fi
          echo "Version $tag is not yet released; proceeding."

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push service images
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for svc in sky-booking sky-offer sky-message sky-notify sky-gateway; do
            image="lukk17/${svc}"
            docker build -f "${svc}/docker/Dockerfile" -t "${image}:${VERSION}" -t "${image}:latest" .
            docker push "${image}:${VERSION}"
            docker push "${image}:latest"
          done

  github-release:
    needs: build-and-push
    runs-on: ubuntu-26.04
    # Manual approval gate: configure the "release" Environment with a required
    # reviewer in repo Settings > Environments. The run pauses here until approved.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Re-check version not released (race guard)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $tag already exists on GitHub."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${{ inputs.version }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            --target "${{ github.sha }}"
