sky:
  apiPrefix: api/v1
  s3:
    endpoint: http://localhost:9000
    presign-endpoint: ""
    region: us-east-1
    bucket: sky-offers-test
    access-key: test-access-key
    secret-key: test-secret-key
    path-style-access: true
    presign-ttl: PT15M

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost/test-issuer
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  kafka:
    # bootstrap-servers wired by @ServiceConnection on the Testcontainers Kafka.
    consumer:
      auto-offset-reset: earliest

logging:
  level:
    state:
      change:
        logger: ERROR
    kafka:
      cluster: ERROR
      controller:
        KafkaController: ERROR
        RequestSendThread: ERROR
        TopicDeletionManager: ERROR
      network: ERROR
      coordinator: ERROR
      log: ERROR
      server:
        KafkaConfig: ERROR
        FinalizedFeatureChangeListener: ERROR
        BrokerToControllerRequestThread: ERROR
    org:
      apache:
        kafka:
          server:
            ReplicaAlterLogDirsManager: ERROR
            operationPurgatory$ExpiredOperationReaper: ERROR
            controllerEventManager$ControllerEventThread: ERROR
          common: ERROR
          coordinator: ERROR
          log: ERROR
          clients:
            quota: ERROR
            Metadata: ERROR
            consumer:
              ConsumerConfig: ERROR
              internals: ERROR
