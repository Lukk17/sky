# ==================================================================================================================
sky:
  apiPrefix: /api/v1
  crossOrigin:
    allowed: ${ACCESS_CONTROL_ALLOW_ORIGIN:https://skycloud.luksarna.com}

# SPRING setup

server:
  port: ${OFFER_PORT:5552}
  forward-headers-strategy: framework

springdoc:
  info:
    title: sky-offer
    version: v1
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: '/swagger-ui.html'
    urls:
      - url: ${SWAGGER_URL:/v3/api-docs/public}
        name: Booking API doc

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: sky-offer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI}
  web:
    # location from http header
    locale-resolver: accept_header
  mvc:
    # for option request handling
    dispatch-options-request: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  jpa:
    # validate: schema must match entities; migrations own evolution.
    hibernate.ddl-auto: validate
    show-sql: ${SHOW_SQL_QUERIES:false}
    properties:
      hibernate:
        jdbc:
          time_zone: Europe/Warsaw

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://host.docker.internal:5432/sky}
    hikari:
      connection-timeout: 60000
      validation-timeout: 60000
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: ${KAFKA_ADDRESS:kafka-service}:${KAFKA_PORT:9092}
    producer:
      client-id: offerService
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      auto-create: true

management:
  endpoints:
    web:
      exposure:
        include: "health,info,prometheus"
  metrics:
    tags:
      application: ${spring.application.name}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org:
      springframework:
        web: ${SPRING_DEBUG:INFO}
      hibernate: ${HIBERNATE_DEBUG:WARN}
      apache:
        kafka:
          clients:
            admin:
              AdminClientConfig: WARN
            producer:
              ProducerConfig: WARN
